    class SoundFX {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      toggle() {
        this.muted = !this.muted;
        return this.muted;
      }
      tick() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(700, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.03);
          gain.gain.setValueAtTime(0.03, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.03);
        } catch (e) {}
      }
      beep() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(920, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.005, this.ctx.currentTime + 0.06);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.06);
        } catch (e) {}
      }
      correct() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + i * 0.05);
            gain.gain.setValueAtTime(0.1, now + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.05);
            osc.stop(now + i * 0.05 + 0.25);
          });
        } catch (e) {}
      }
      wrong() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(170, this.ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(80, this.ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.2);
        } catch (e) {}
      }
    }

    // 7. VIEW C: GAME MODE (WORD BOMB ARENA IN UNIFIED LIGHT/DARK CONTAINER)
    // =========================================================================
    function GameArenaView({ onReturn }) {
      const [currentQIndex, setCurrentQIndex] = useState(0);
      const [lives, setLives] = useState(3);
      const [score, setScore] = useState(0);
      const [streak, setStreak] = useState(0);
      const [timeRemaining, setTimeRemaining] = useState(15.0);
      const [gameState, setGameState] = useState('PLAYING');
      const [selectedChoice, setSelectedChoice] = useState(null);
      const [isAnswerCorrect, setIsAnswerCorrect] = useState(null);
      const [idInput, setIdInput] = useState('');
      const inputRef = useRef(null);

      const activeQ = GAME_QUESTIONS[currentQIndex];
      const isDanger = timeRemaining <= 5.0 && timeRemaining > 0;

      // Timer Interval
      useEffect(() => {
        if (gameState !== 'PLAYING') return;
        const interval = setInterval(() => {
          setTimeRemaining(prev => {
            const next = Math.max(0, prev - 0.1);
            if (next <= 5.0 && next > 0) {
              if (Math.round(next * 10) % 2 === 0) sound.beep();
            } else {
              if (Math.round(next * 10) % 10 === 0) sound.tick();
            }
            if (next <= 0) {
              clearInterval(interval);
              handleTimeout();
              return 0;
            }
            return next;
          });
        }, 100);
        return () => clearInterval(interval);
      }, [gameState, currentQIndex]);

      const handleTimeout = () => {
        sound.wrong();
        const nextLives = lives - 1;
        setLives(nextLives);
        setStreak(0);
        if (nextLives <= 0) {
          setGameState('DETONATED');
        } else {
          advanceNextQuestion();
        }
      };

      const handleMultipleChoice = (choiceIdx) => {
        if (selectedChoice !== null || gameState !== 'PLAYING') return;
        setSelectedChoice(choiceIdx);
        const isRight = choiceIdx === activeQ.correctIndex;
        setIsAnswerCorrect(isRight);

        if (isRight) {
          sound.correct();
          setScore(s => s + 500 + streak * 50);
          setStreak(st => st + 1);
          setTimeout(() => advanceNextQuestion(), 550);
        } else {
          sound.wrong();
          const nextLives = lives - 1;
          setLives(nextLives);
          setStreak(0);
          setTimeout(() => {
            setSelectedChoice(null);
            setIsAnswerCorrect(null);
            if (nextLives <= 0) setGameState('DETONATED');
          }, 650);
        }
      };

      const handleIdentificationSubmit = (e) => {
        if (e) e.preventDefault();
        if (gameState !== 'PLAYING' || !idInput.trim()) return;
        const isRight = idInput.trim().toLowerCase() === activeQ.correctAnswer.toLowerCase();
        setIsAnswerCorrect(isRight);

        if (isRight) {
          sound.correct();
          setScore(s => s + 500 + streak * 50);
          setStreak(st => st + 1);
          setTimeout(() => advanceNextQuestion(), 550);
        } else {
          sound.wrong();
          const nextLives = lives - 1;
          setLives(nextLives);
          setStreak(0);
          setTimeout(() => {
            setIdInput('');
            setIsAnswerCorrect(null);
            if (inputRef.current) inputRef.current.focus();
            if (nextLives <= 0) setGameState('DETONATED');
          }, 650);
        }
      };

      const advanceNextQuestion = () => {
        if (currentQIndex + 1 < GAME_QUESTIONS.length) {
          setCurrentQIndex(i => i + 1);
          setTimeRemaining(15.0);
          setSelectedChoice(null);
          setIsAnswerCorrect(null);
          setIdInput('');
        } else {
          setGameState('DEFUSED');
        }
      };

      const resetGame = () => {
        setCurrentQIndex(0);
        setLives(3);
        setScore(0);
        setStreak(0);
        setTimeRemaining(15.0);
        setGameState('PLAYING');
        setSelectedChoice(null);
        setIsAnswerCorrect(null);
        setIdInput('');
      };

      return (
        <div className="max-w-4xl mx-auto space-y-5">
          
          {/* Top HUD Card */}
          <div className="bg-white dark:bg-[#1a1a1a] border border-gray-200 dark:border-[#2a2a2a] rounded-2xl px-5 py-3 shadow-sm flex items-center justify-between">
            <button 
              onClick={onReturn}
              className="text-xs font-bold text-gray-500 hover:text-gray-900 dark:hover:text-white flex items-center gap-1.5 transition"
            >
              &larr; Return to Library
            </button>

            <div className="flex items-center gap-2">
              <span className="text-xs font-bold px-3 py-1 rounded-full bg-gray-100 dark:bg-[#262626] text-gray-700 dark:text-gray-300">
                Question {currentQIndex + 1} of {GAME_QUESTIONS.length}
              </span>
              <span className="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-full bg-[#fff1ee] dark:bg-[#2a1309] text-[#f04824]">
                {activeQ.formatLabel}
              </span>
            </div>

            {/* Lives & Score */}
            <div className="flex items-center gap-3">
              <div className="flex items-center gap-1">
                {[1, 2, 3].map(i => (
                  <div 
                    key={i} 
                    className={`w-3.5 h-3.5 rounded-full transition ${
                      lives >= i ? 'bg-[#f04824]' : 'bg-gray-300 dark:bg-[#333333]'
                    }`} 
                  />
                ))}
              </div>
              <div className="text-sm font-black text-gray-900 dark:text-white">
                {score.toLocaleString()} <span className="text-xs text-[#f04824]">PTS</span>
              </div>
            </div>
          </div>

          {/* Central Active Bomb Stage Container */}
          <div className="bg-white dark:bg-[#1a1a1a] border border-gray-200 dark:border-[#2a2a2a] rounded-3xl p-6 sm:p-8 shadow-sm flex flex-col items-center justify-center text-center relative overflow-hidden">
            
            {/* Mascot Visual with Fuse */}
            <div className={`relative transition-transform duration-150 my-2 ${isDanger ? 'animate-shake-danger' : ''}`}>
              <svg width="150" height="150" viewBox="0 0 200 200" className="drop-shadow-lg">
                <defs>
                  <radialGradient id="bombBodyUnified" cx="35%" cy="35%" r="65%">
                    <stop offset="0%" stopColor="#3d3835" />
                    <stop offset="60%" stopColor="#181514" />
                    <stop offset="100%" stopColor="#080605" />
                  </radialGradient>
                </defs>
                {/* Fuse rope */}
                <path d="M 100 42 C 100 25, 125 32, 132 15" fill="none" stroke={isDanger ? "#ef4444" : "#ca8a04"} strokeWidth="6" strokeLinecap="round" />
                {/* Spark */}
                <circle cx="132" cy="15" r="7" fill="#f04824" className="animate-spark-pulse" />
                {/* Horns */}
                <path d="M 52 75 C 38 48, 48 30, 68 46 C 60 56, 56 68, 52 75 Z" fill="#ffffff" stroke="#262626" strokeWidth="2" />
                <path d="M 148 75 C 162 48, 152 30, 132 46 C 140 56, 144 68, 148 75 Z" fill="#ffffff" stroke="#262626" strokeWidth="2" />
                {/* Main Body */}
                <circle cx="100" cy="116" r="74" fill="url(#bombBodyUnified)" stroke={isDanger ? "#ef4444" : "#2e2a28"} strokeWidth="3" />
                {/* Eyes */}
                <circle cx="82" cy="108" r="7.5" fill={isDanger ? "#ef4444" : "#ffffff"} />
                <circle cx="118" cy="108" r="7.5" fill={isDanger ? "#ef4444" : "#ffffff"} />
                {/* Mouth */}
                <rect x="85" y="130" width="30" height="10" rx="5" fill="#242220" stroke="#3d3835" strokeWidth="1.5" />
              </svg>
            </div>

            {/* Fuse Countdown Bar */}
            <div className="w-full max-w-sm mb-6">
              <div className="flex justify-between text-xs font-bold mb-1">
                <span className={isDanger ? 'text-red-500 animate-pulse' : 'text-gray-400'}>
                  {isDanger ? 'WARNING: DETONATING' : 'FUSE TIMER'}
                </span>
                <span className={`text-sm ${isDanger ? 'text-red-500 font-extrabold' : 'text-[#f04824]'}`}>
                  {timeRemaining.toFixed(1)}s
                </span>
              </div>
              <div className="w-full h-2.5 bg-gray-100 dark:bg-[#262626] rounded-full overflow-hidden">
                <div 
                  className={`h-full rounded-full transition-all duration-75 ${
                    isDanger ? 'bg-red-500' : 'bg-gradient-to-r from-[#c84e10] to-[#f04824]'
                  }`} 
                  style={{ width: `${(timeRemaining / 15.0) * 100}%` }} 
                />
              </div>
            </div>

            {/* Question Banner */}
            <div className="w-full max-w-2xl bg-gray-50 dark:bg-[#222222] border border-gray-200 dark:border-[#333333] rounded-2xl p-6 mb-6">
              <span className="text-[11px] font-bold uppercase tracking-wider text-gray-400 dark:text-gray-500 block mb-1">
                {activeQ.hint}
              </span>
              <h2 className="text-lg sm:text-xl font-extrabold text-gray-900 dark:text-white leading-snug">
                {activeQ.prompt}
              </h2>
            </div>

            {/* Dual Input Zone */}
            <div className="w-full max-w-2xl">
              {activeQ.type === 'MULTIPLE_CHOICE' ? (
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {activeQ.options.map((opt, idx) => {
                    const letter = String.fromCharCode(65 + idx);
                    const isSelected = selectedChoice === idx;
                    
                    let btnStyle = "bg-white dark:bg-[#202020] border-gray-200 dark:border-[#333333] text-gray-800 dark:text-gray-200 hover:border-[#f04824]";
                    if (isSelected) {
                      btnStyle = isAnswerCorrect
                        ? "bg-emerald-500 text-white border-emerald-500"
                        : "bg-red-500 text-white border-red-500 animate-shake-error";
                    }

                    return (
                      <button
                        key={idx}
                        onClick={() => handleMultipleChoice(idx)}
                        disabled={selectedChoice !== null}
                        className={`p-4 rounded-xl border-2 font-semibold text-sm flex items-center gap-3 transition ${btnStyle}`}
                      >
                        <span className="w-7 h-7 rounded-lg bg-gray-100 dark:bg-[#2e2e2e] flex items-center justify-center text-xs">
                          {letter}
                        </span>
                        <span>{opt}</span>
                      </button>
                    );
                  })}
                </div>
              ) : (
                <form onSubmit={handleIdentificationSubmit} className="flex items-center gap-2">
                  <input
                    ref={inputRef}
                    type="text"
                    value={idInput}
                    onChange={(e) => setIdInput(e.target.value)}
                    placeholder="Type the exact term to defuse..."
                    className="flex-1 bg-white dark:bg-[#202020] border-2 border-gray-200 dark:border-[#333333] focus:border-[#f04824] rounded-xl px-4 py-3 text-sm text-gray-900 dark:text-white outline-none"
                  />
                  <button
                    type="submit"
                    disabled={!idInput.trim()}
                    className="bg-[#f04824] hover:bg-[#ff5a36] disabled:opacity-40 text-white font-bold text-sm px-6 py-3 rounded-xl transition "
                  >
                    Defuse
                  </button>
                </form>
              )}
            </div>

          </div>

          {/* End-of-Run Modal Overlay */}
          {gameState !== 'PLAYING' && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-[#1a1a1a] border border-gray-200 dark:border-[#2a2a2a] rounded-3xl p-6 sm:p-8 max-w-md w-full text-center shadow-2xl">
                <div className={`w-14 h-14 rounded-2xl mx-auto flex items-center justify-center mb-3 ${
                  gameState === 'DEFUSED' ? 'bg-emerald-100 text-emerald-600' : 'bg-red-100 text-red-600'
                }`}>
                  {gameState === 'DEFUSED' ? <Icons.Check /> : <Icons.Cross />}
                </div>
                <h3 className="text-xl font-black uppercase tracking-tight text-gray-900 dark:text-white">
                  {gameState === 'DEFUSED' ? 'ALL BOMBS DEFUSED' : 'BOMB DETONATED'}
                </h3>
                <p className="text-xs text-gray-500 dark:text-gray-400 mt-1">
                  Final Score: <b className="text-[#f04824] ">{score.toLocaleString()} PTS</b>
                </p>

                <div className="flex gap-3 mt-6">
                  <button
                    onClick={resetGame}
                    className="flex-1 bg-[#f04824] text-white font-bold text-xs py-3 rounded-xl hover:bg-[#ff5a36] transition"
                  >
                    Play Again
                  </button>
                  <button
                    onClick={onReturn}
                    className="flex-1 bg-gray-100 dark:bg-[#262626] text-gray-700 dark:text-gray-300 font-bold text-xs py-3 rounded-xl hover:bg-gray-200 transition"
                  >
                    Return to Library
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // =========================================================================
    // 8. VIEW D: ADMIN / SESSION HISTORY TAB
    // =========================================================================
    function HistoryAdminView() {
      const [sessions] = useState(INITIAL_SESSIONS);

      return (
        <div className="max-w-7xl mx-auto space-y-6">
          <div>
            <span className="text-xs font-bold uppercase tracking-wider text-gray-400 dark:text-gray-500">
              AUDIT & LOGS
            </span>
            <h1 className="text-2xl sm:text-3xl font-black text-gray-900 dark:text-white tracking-tight mt-0.5">
              Session History & Performance Logs
            </h1>
            <p className="text-sm text-gray-500 dark:text-gray-400">
              Track user session logs, deck ownership, questions missed, and retention scores.
            </p>
          </div>

          <div className="bg-white dark:bg-[#1a1a1a] border border-gray-200 dark:border-[#2a2a2a] rounded-2xl shadow-sm overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead className="bg-gray-50 dark:bg-[#202020] border-b border-gray-200 dark:border-[#2a2a2a] text-gray-400 ">
                  <tr>
                    <th className="p-4">SESSION ID</th>
                    <th className="p-4">DECK NAME</th>
                    <th className="p-4">MODE</th>
                    <th className="p-4">SCORE</th>
                    <th className="p-4">ACCURACY</th>
                    <th className="p-4">MISSED ITEMS</th>
                    <th className="p-4">TIMESTAMP</th>
                    <th className="p-4">STATUS</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-100 dark:divide-[#262626]">
                  {sessions.map(s => (
                    <tr key={s.id} className="hover:bg-gray-50/50 dark:hover:bg-[#222222]/50 transition">
                      <td className="p-4 text-gray-400 font-bold">{s.id}</td>
                      <td className="p-4 font-bold text-gray-800 dark:text-gray-200">{s.deck}</td>
                      <td className="p-4 text-gray-600 dark:text-gray-400">{s.mode}</td>
                      <td className="p-4 font-bold text-[#f04824]">{s.score}</td>
                      <td className="p-4 font-bold text-emerald-600 dark:text-emerald-400">{s.accuracy}</td>
                      <td className="p-4 text-gray-500 dark:text-gray-400">{s.missedDetails}</td>
                      <td className="p-4 text-gray-400">{s.date}</td>
                      <td className="p-4">
                        <span className="px-2.5 py-1 rounded-full text-[10px] font-bold bg-gray-100 dark:bg-[#262626] text-gray-700 dark:text-gray-300">
                          {s.status}
                        </span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // Mount App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
