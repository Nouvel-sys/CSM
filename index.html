                      <div>
                        <h2 className="font-display font-black text-3xl text-white leading-tight">
                          {selectedBombDeck.code.split(' ')[0]}<br />
                          {selectedBombDeck.code.split(' ').slice(1).join(' ')}
                        </h2>
                        <span className="text-xs text-zinc-400 mt-1 block">
                          {selectedBombDeck.cards?.length || 3} BombCards
                        </span>
                      </div>
                      <div className="w-16 h-16 rounded-full bg-white flex items-center justify-center p-2.5 shrink-0 shadow-lg shadow-black/40">
                        <img src="csm-sidebar-logo.png" alt="Mascot" className="w-full h-full object-contain" />
                      </div>
                    </div>

                    {/* Selected Rules Summary */}
                    <div className="bg-[#202025] rounded-2xl p-4 space-y-3.5 border border-white/5 text-xs">
                      <div className="flex items-center justify-between text-zinc-300">
                        <span className="flex items-center gap-2 text-zinc-400">
                          <span className="text-rose-400">&#10084;</span> Lives
                        </span>
                        <span className="font-bold text-white">{livesSetting}</span>
                      </div>
                      <div className="border-t border-white/5"></div>
                      <div className="flex items-center justify-between text-zinc-300">
                        <span className="flex items-center gap-2 text-zinc-400">
                          <span className="text-blue-400">&#9201;</span> Time per Card
                        </span>
                        <span className="font-bold text-white">{timeSetting}</span>
                      </div>
                      <div className="border-t border-white/5"></div>
                      <div className="flex items-center justify-between text-zinc-300">
                        <span className="flex items-center gap-2 text-zinc-400">
                          <span className="text-purple-400">&#128256;</span> Order
                        </span>
                        <span className="font-bold text-white">{orderSetting}</span>
                      </div>
                      <div className="border-t border-white/5"></div>
                      <div className="flex items-center justify-between text-zinc-300">
                        <span className="flex items-center gap-2 text-zinc-400">
                          <span className="text-emerald-400">&#128269;</span> Test Type
                        </span>
                        <span className="font-bold text-white">{testTypeSetting}</span>
                      </div>
                    </div>
                  </div>

                  {/* Start Bomb Mode Button */}
                  <div className="relative z-10 mt-6">
                    <button
                      onClick={handleStartBombMode}
                      className="w-full py-3.5 bg-[#f04824] hover:bg-[#ff5a36] text-white font-display font-black text-sm rounded-xl shadow-xl shadow-[#f04824]/40 transition-all active:scale-[0.98] cursor-pointer"
                    >
                      Start Bomb Mode &rarr;
                    </button>
                  </div>

                </div>

              </div>
            )}

          </main>

          {/* ========================================================
              3. CREATE NEW DECK MODAL (FIGMA MATCH)
              ======================================================== */}
          {isCreateDeckOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl animate-[modalPop_0.2s_ease-out]">
                <span className="text-[10.5px] font-extrabold text-[#f04824] uppercase tracking-wider">REVIEWER LIBRARY</span>
                <h3 className="font-display font-black text-slate-900 text-xl mt-0.5 mb-1">Create New Deck</h3>
                <p className="text-xs text-slate-500 mb-5">Give your new deck a title and description.</p>

                <form onSubmit={handleCreateDeckSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-800 mb-1.5">Deck Name *</label>
                    <input
                      type="text"
                      required
                      value={newDeckName}
                      onChange={(e) => setNewDeckName(e.target.value)}
                      placeholder="e.g. ITE 366 - Software Engineering"
                      className="w-full h-10 px-3.5 bg-slate-100 border border-slate-300 rounded-xl text-xs text-slate-900 outline-none focus:bg-white focus:border-[#f04824]"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-800 mb-1.5">Description / Subject *</label>
                    <input
                      type="text"
                      required
                      value={newDeckSubject}
                      onChange={(e) => setNewDeckSubject(e.target.value)}
                      placeholder="Brief summary or subject name for this reviewer."
                      className="w-full h-10 px-3.5 bg-slate-100 border border-slate-300 rounded-xl text-xs text-slate-900 outline-none focus:bg-white focus:border-[#f04824]"
                    />
                  </div>

                  <div className="flex items-center justify-end gap-3 pt-3">
                    <button
                      type="button"
                      onClick={() => setIsCreateDeckOpen(false)}
                      className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition-colors cursor-pointer"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-[#f04824] hover:bg-[#ff5a36] text-white font-bold text-xs rounded-xl shadow-md transition-all cursor-pointer"
                    >
                      Create Deck
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ========================================================
              4. ADD MATERIAL MODAL (FIGMA MATCH)
              ======================================================== */}
          {isAddMaterialOpen && selectedDeck && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl relative">
                
                {/* Header */}
                <div className="flex items-start justify-between mb-5">
                  <div>
                    <span className="text-[10px] font-extrabold text-[#f04824] uppercase tracking-wider">ADD MATERIAL</span>
                    <h3 className="font-display font-black text-slate-900 text-xl mt-0.5">{selectedDeck.code}</h3>
                  </div>
                  <button
                    onClick={() => setIsAddMaterialOpen(false)}
                    className="px-3 py-1 bg-red-600 hover:bg-red-700 text-white font-bold text-xs rounded-lg transition-colors cursor-pointer"
                  >
                    Cancel
                  </button>
                </div>

                {/* Drop Area */}
                <label className="border-2 border-dashed border-slate-300 hover:border-[#f04824] bg-slate-100/70 hover:bg-slate-100 rounded-2xl p-6 flex flex-col items-center justify-center text-center cursor-pointer transition-all block mb-4">
                  <input
                    type="file"
                    accept=".pdf"
                    className="hidden"
                    onChange={(e) => {
                      const file = e.target.files?.[0];
                      if (file) {
                        const newDoc = { id: 'doc-' + Date.now(), title: file.name };
                        setDecks(prev => prev.map(d => d.id === selectedDeck.id ? {
                          ...d,
                          documents: [...(d.documents || []), newDoc]
                        } : d));
                        setSelectedDeck(prev => ({
                          ...prev,
                          documents: [...(prev.documents || []), newDoc]
                        }));
                        setIsAddMaterialOpen(false);
                      }
                    }}
                  />
                  <div className="w-10 h-10 rounded-xl bg-white border border-slate-200 flex items-center justify-center mb-2 shadow-sm text-slate-700">
                    <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                      <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
                      <polyline points="17 8 12 3 7 8" />
                      <line x1="12" y1="3" x2="12" y2="15" />
                    </svg>
                  </div>
                  <span className="font-bold text-slate-800 text-xs mb-0.5">Drag or upload file here</span>
                  <span className="text-[10px] text-slate-400 mb-3">Supported format - PDF documents only</span>
                  <span className="px-3.5 py-1.5 bg-white border border-slate-300 rounded-lg text-xs font-bold text-slate-700 shadow-sm">
                    Upload File
                  </span>
                </label>

                {/* OR divider */}
                <div className="flex items-center gap-3 my-4">
                  <div className="flex-1 border-t border-slate-200"></div>
                  <span className="text-[10px] font-bold text-slate-400">OR</span>
                  <div className="flex-1 border-t border-slate-200"></div>
                </div>

                {/* Two Option Cards */}
                <div className="grid grid-cols-2 gap-3">
                  <div 
                    onClick={() => {
                      setIsAddMaterialOpen(false);
                      setLibrarySubView('flashcards');
                    }}
                    className="border border-slate-200 hover:border-slate-300 bg-slate-50 hover:bg-slate-100 rounded-xl p-3 cursor-pointer transition-all"
                  >
                    <div className="w-5 h-5 rounded bg-slate-800 mb-2"></div>
                    <h5 className="font-bold text-slate-900 text-xs leading-tight">Create Bombcards Manually</h5>
                    <p className="text-[9.5px] text-slate-500 mt-1">Create your own Bombcards</p>
                  </div>

                  <div className="border border-slate-200 bg-slate-100/60 rounded-xl p-3 opacity-60 relative overflow-hidden flex flex-col items-center justify-center text-center">
                    <span className="px-2.5 py-1 bg-[#f04824] text-white text-[9.5px] font-extrabold rounded-full tracking-wider uppercase shadow-sm">
                      COMING SOON
                    </span>
                  </div>
                </div>

              </div>
            </div>
          )}

          {/* ========================================================
              5. ACTIVE BOMB GAMEPLAY MODAL (FIGMA MATCH)
              ======================================================== */}
          {isBombPlaying && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#1e1e21] border border-white/10 rounded-[28px] max-w-[960px] w-full min-h-[580px] p-8 text-white relative shadow-2xl flex flex-col justify-between overflow-hidden">
                
                {/* Header */}
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="w-9 h-9 rounded-full bg-[#2a2a30] flex items-center justify-center p-1.5 shadow-md">
                      <img src="csm-sidebar-logo.png" alt="Mascot" className="w-full h-full object-contain" />
                    </div>
                    <span className="font-display font-bold text-base text-white">
                      Game Mode: {selectedBombDeck.code}
                    </span>
                  </div>
                  <button
                    onClick={() => setIsBombPlaying(false)}
                    className="w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-zinc-400 hover:text-white transition-colors cursor-pointer text-lg"
                  >
                    &#10005;
                  </button>
                </div>

                {/* Status Indicator if Won or Detonated */}
                {bombGameStatus === 'DETONATED' && (
                  <div className="py-12 text-center animate-bounce">
                    <div className="text-6xl mb-3">&#128165;</div>
                    <h2 className="font-display text-3xl font-black text-rose-500">BOOM! BOMB DETONATED</h2>
                    <p className="text-sm text-zinc-400 mt-2 mb-6">Time ran out or all lives were lost.</p>
                    <button
                      onClick={handleStartBombMode}
                      className="px-7 py-3 bg-[#f04824] hover:bg-[#ff5a36] text-white font-bold text-xs rounded-xl shadow-lg cursor-pointer"
                    >
                      Try Again
                    </button>
                  </div>
                )}

                {bombGameStatus === 'WON' && (
                  <div className="py-12 text-center">
                    <div className="text-6xl mb-3">&#127942;</div>
                    <h2 className="font-display text-3xl font-black text-emerald-400">DEFUSED! YOU WIN</h2>
                    <p className="text-sm text-zinc-400 mt-2 mb-6">You successfully cleared all bombcards in this set!</p>
                    <button
                      onClick={() => setIsBombPlaying(false)}
                      className="px-7 py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs rounded-xl shadow-lg cursor-pointer"
                    >
                      Return to Study Desk
                    </button>
                  </div>
                )}

                {bombGameStatus === 'PLAYING' && (
                  <div className="my-auto flex flex-col items-center">
                    {/* Glowing Countdown Bomb */}
                    <div className="relative flex items-center justify-center mb-6">
                      {/* Golden ambient halo glow */}
                      <div className="absolute w-28 h-28 bg-amber-500/30 rounded-full blur-2xl pointer-events-none"></div>
                      
                      {/* Spark flames */}
                      <div className="absolute -top-4 right-0 text-amber-400 text-2xl animate-pulse">
                        &#10024;
                      </div>
                      
                      {/* Bomb Body with countdown number */}
                      <div className={`w-16 h-16 rounded-full bg-black border-2 border-zinc-700 flex items-center justify-center shadow-[0_0_30px_rgba(245,158,11,0.45)] relative z-10 ${
                        bombTimeRemaining <= 5 ? 'border-rose-500 animate-shake-danger' : ''
                      }`}>
                        <span className="font-display text-2xl font-black text-white">
                          {bombTimeRemaining}
                        </span>
                      </div>
                    </div>

                    {/* Question Box (Figma Match) */}
                    <div className="bg-[#28282c] border border-white/5 rounded-2xl p-7 max-w-[640px] w-full text-center shadow-xl">
                      <span className="text-[10.5px] font-extrabold text-zinc-400 uppercase tracking-wider block mb-2.5">
                        CHOOSE AN ANSWER
                      </span>
                      <h3 className="font-display text-lg md:text-xl font-bold text-white leading-relaxed mb-6">
                        {selectedBombDeck.cards?.[bombCurrentQIndex]?.prompt || "What is main purpose of Information System"}
                      </h3>

                      {/* 4 Options Grid (2x2) */}
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                        {(selectedBombDeck.cards?.[bombCurrentQIndex]?.options || [
                          'A. To collect, process, store, and distribute information.',
                          'B. To design computer hardware and components',
                          'C. To create entertainment and video games',
                          'D. To replace all human decision-making'
                        ]).map((optionText, optIdx) => {
                          const isSelected = bombSelectedOption === optIdx;
                          const isCorrectAnswer = optIdx === (selectedBombDeck.cards?.[bombCurrentQIndex]?.correctIndex ?? 0);
                          
                          let buttonStyles = 'bg-[#1c1c1f] border-white/10 text-zinc-300 hover:bg-[#25252a]';
                          if (isSelected) {
                            if (isCorrectAnswer) {
                              buttonStyles = 'border-2 border-[#22c55e] bg-[#22c55e]/15 text-white shadow-[0_0_16px_rgba(34,197,94,0.35)]';
                            } else {
                              buttonStyles = 'border-2 border-rose-500 bg-rose-500/15 text-white';
                            }
                          }

                          return (
                            <button
                              key={optIdx}
                              onClick={() => handleAnswerChoice(optIdx)}
                              className={`p-4 rounded-xl border text-left text-xs font-semibold leading-snug transition-all cursor-pointer ${buttonStyles}`}
                            >
                              {optionText}
                            </button>
                          );
                        })}
                      </div>
                    </div>

                  </div>
                )}

                {/* Empty spacer for bottom balance */}
                <div className="h-2"></div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>

</html>
