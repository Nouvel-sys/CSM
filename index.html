    // SOUND ENGINE
    // ========================================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      tick() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.04);
          gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.04);
        } catch (e) { }
      }
      correct() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          [523.25, 659.25, 783.99].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.07);
            gain.gain.setValueAtTime(0.12, this.ctx.currentTime + idx * 0.07);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.07 + 0.16);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + idx * 0.07);
            osc.stop(this.ctx.currentTime + idx * 0.07 + 0.16);
          });
        } catch (e) { }
      }
      wrong() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, this.ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(80, this.ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.2);
        } catch (e) { }
      }
    }
    const sound = new SoundEngine();

        let timer;
        if (isBombPlaying && bombGameStatus === 'PLAYING') {
          timer = setInterval(() => {
            setBombTimeRemaining(prev => {
              if (prev <= 1) {
                // Bomb exploded!
                sound.wrong();
                setBombGameStatus('DETONATED');
                return 0;
              }
              if (prev <= 5) {
                sound.tick();
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [isBombPlaying, bombGameStatus]);

      // Start Bomb Mode

        const seconds = parseInt(timeSetting, 10) || 30;
        setBombTimeRemaining(seconds);
        setBombCurrentQIndex(0);
        setBombSelectedOption(null);
        setBombIsCorrect(null);
        const startingLives = livesSetting === '∞' ? 999 : parseInt(livesSetting, 10);
        setBombRemainingLives(startingLives);
        setBombDefusedCount(0);
        setBombGameStatus('PLAYING');
        setIsBombPlaying(true);
      };

      // Handle Answer Choice in Bomb Mode
      const handleAnswerChoice = (choiceIndex) => {
        if (bombSelectedOption !== null || bombGameStatus !== 'PLAYING') return;

        const currentDeckCards = selectedBombDeck?.cards || [];
        const currentCard = currentDeckCards[bombCurrentQIndex] || currentDeckCards[0];
        const isRight = choiceIndex === (currentCard?.correctIndex ?? 0);

        setBombSelectedOption(choiceIndex);
        setBombIsCorrect(isRight);

        if (isRight) {
          sound.correct();
          setBombDefusedCount(prev => prev + 1);
          setTimeout(() => {
            if (bombCurrentQIndex + 1 < currentDeckCards.length) {
              setBombCurrentQIndex(prev => prev + 1);
              const seconds = parseInt(timeSetting, 10) || 30;
              setBombTimeRemaining(seconds);
              setBombSelectedOption(null);
              setBombIsCorrect(null);
            } else {
              setBombGameStatus('WON');
            }
          }, 1200);
        } else {
          sound.wrong();
          const nextLives = bombRemainingLives - 1;
          setBombRemainingLives(nextLives);
          if (nextLives <= 0) {
            setTimeout(() => {
              setBombGameStatus('DETONATED');
            }, 800);
          } else {

              setBombIsCorrect(null);

                    <button
                      onClick={handleStartBombMode}
                      className="px-7 py-3 bg-[#f04824] hover:bg-[#ff5a36] text-white font-bold text-xs rounded-xl shadow-lg cursor-pointer"
                    >
                      Try Again
                    </button>
                  </div>
                )}

                {bombGameStatus === 'WON' && (
                  <div className="py-12 text-center">
                    <div className="text-6xl mb-3">&#127942;</div>
                    <h2 className="font-display text-3xl font-black text-emerald-400">DEFUSED! YOU WIN</h2>
                    <p className="text-sm text-zinc-400 mt-2 mb-6">You successfully cleared all bombcards in this set!</p>
                    <button
                      onClick={() => setIsBombPlaying(false)}
                      className="px-7 py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs rounded-xl shadow-lg cursor-pointer"
                    >
                      Return to Study Desk
                    </button>
                  </div>
                )}

                {bombGameStatus === 'PLAYING' && (
                  <div className="my-auto flex flex-col items-center">
                    {/* Glowing Countdown Bomb */}
                    <div className="relative flex items-center justify-center mb-6">
                      {/* Golden ambient halo glow */}
                      <div className="absolute w-28 h-28 bg-amber-500/30 rounded-full blur-2xl pointer-events-none"></div>
                      
                      {/* Spark flames */}
                      <div className="absolute -top-4 right-0 text-amber-400 text-2xl animate-pulse">
                        &#10024;
                      </div>
                      
                      {/* Bomb Body with countdown number */}
                      <div className={`w-16 h-16 rounded-full bg-black border-2 border-zinc-700 flex items-center justify-center shadow-[0_0_30px_rgba(245,158,11,0.45)] relative z-10 ${
                        bombTimeRemaining <= 5 ? 'border-rose-500 animate-shake-danger' : ''
                      }`}>
                        <span className="font-display text-2xl font-black text-white">
                          {bombTimeRemaining}
                        </span>
                      </div>
                    </div>

                    {/* Question Box (Figma Match) */}
                    <div className="bg-[#28282c] border border-white/5 rounded-2xl p-7 max-w-[640px] w-full text-center shadow-xl">
                      <span className="text-[10.5px] font-extrabold text-zinc-400 uppercase tracking-wider block mb-2.5">
                        CHOOSE AN ANSWER
                      </span>
                      <h3 className="font-display text-lg md:text-xl font-bold text-white leading-relaxed mb-6">
                        {selectedBombDeck.cards?.[bombCurrentQIndex]?.prompt || "What is main purpose of Information System"}
                      </h3>

                      {/* 4 Options Grid (2x2) */}
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                        {(selectedBombDeck.cards?.[bombCurrentQIndex]?.options || [
                          'A. To collect, process, store, and distribute information.',
                          'B. To design computer hardware and components',
                          'C. To create entertainment and video games',
                          'D. To replace all human decision-making'
                        ]).map((optionText, optIdx) => {
                          const isSelected = bombSelectedOption === optIdx;
                          const isCorrectAnswer = optIdx === (selectedBombDeck.cards?.[bombCurrentQIndex]?.correctIndex ?? 0);
                          
                          let buttonStyles = 'bg-[#1c1c1f] border-white/10 text-zinc-300 hover:bg-[#25252a]';
                          if (isSelected) {
                            if (isCorrectAnswer) {
                              buttonStyles = 'border-2 border-[#22c55e] bg-[#22c55e]/15 text-white shadow-[0_0_16px_rgba(34,197,94,0.35)]';
                            } else {
                              buttonStyles = 'border-2 border-rose-500 bg-rose-500/15 text-white';
                            }
                          }

                          return (
                            <button
                              key={optIdx}
                              onClick={() => handleAnswerChoice(optIdx)}
                              className={`p-4 rounded-xl border text-left text-xs font-semibold leading-snug transition-all cursor-pointer ${buttonStyles}`}
                            >
                              {optionText}
                            </button>
                          );
                        })}
                      </div>
                    </div>

                  </div>
                )}

                {/* Empty spacer for bottom balance */}
                <div className="h-2"></div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>

</html>
