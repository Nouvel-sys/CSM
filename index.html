<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Co-StudyMaxx — Study reviewers, made to stick</title>
  <meta name="description"
    content="Create private study reviewers, practice what you missed, and turn every deck into a focused countdown quiz.">

  <!-- Typography: Plus Jakarta Sans (Body/UI), Outfit (Display/Headings), JetBrains Mono (Timer/Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'system-ui', '-apple-system', 'sans-serif'],
            display: ['Outfit', 'Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            brand: {
              orange: '#f04824',
              orangeHover: '#e03e1b',
              orangeLight: '#fff1ee',
              orangeBorder: '#ffd7cf',
              charcoal: '#181818',
              charcoalSurface: '#222222',
              charcoalBorder: '#2e2e2e',
              canvas: '#f4f5f7',
              canvasSurface: '#ffffff',
              canvasBorder: '#e5e7eb'
            }
          },
          keyframes: {
            shakeDanger: {
              '0%, 100%': { transform: 'translateX(0) rotate(0deg)' },
              '20%': { transform: 'translateX(-4px) rotate(-1.5deg)' },
              '40%': { transform: 'translateX(4px) rotate(1.5deg)' },
              '60%': { transform: 'translateX(-3px) rotate(-1deg)' },
              '80%': { transform: 'translateX(3px) rotate(1deg)' },
            },
            shakeError: {
              '0%, 100%': { transform: 'translateX(0)' },
              '20%': { transform: 'translateX(-8px)' },
              '40%': { transform: 'translateX(8px)' },
              '60%': { transform: 'translateX(-6px)' },
              '80%': { transform: 'translateX(6px)' },
            },
            sparkPulse: {
              '0%, 100%': { transform: 'scale(1)', opacity: '1' },
              '50%': { transform: 'scale(1.25)', opacity: '0.8' },
            }
          },
          animation: {
            'shake-danger': 'shakeDanger 0.22s infinite ease-in-out',
            'shake-error': 'shakeError 0.35s ease-in-out',
            'spark-pulse': 'sparkPulse 0.4s infinite ease-in-out',
          }
        }
      }
    };
  </script>

  <!-- React 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --font-helvetica: Helvetica, Arial, sans-serif;
      --font-helvetica-rounded: 'Helvetica Rounded', 'Arial Rounded MT Bold', Helvetica, Arial, sans-serif;
    }

    /* Match the browser's 125% presentation consistently across every tab. */
    html {
      font-size: 100%;
    }

    body {
      background-color: #e8ddd0;
      font-family: var(--font-helvetica);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    h1,
    h2,
    h3,
    .font-display {
      font-family: Helvetica, Arial, sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    /* Ambient Warm Blurred Backdrop */
    .outer-glow-backdrop {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 60% 80% at 0% 30%, rgba(220, 120, 40, 0.5) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 100% 70%, rgba(220, 120, 40, 0.5) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 50% 50%, rgba(240, 225, 210, 0.7) 0%, transparent 70%);
      filter: blur(40px);
    }

    /* Custom Scrollbars */
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .custom-scroll::-webkit-scrollbar-track {
      background: #f1ede8;
      border-radius: 4px;
    }

    .custom-scroll::-webkit-scrollbar-thumb {
      background: #d4cec7;
      border-radius: 4px;
    }

    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: #f04824;
    }

    /* Keep every tab on the same stable app-shell footprint. */
    .app-shell {
      width: 80% !important;
      height: 77% !important;
      flex: none !important;
      min-width: 0;
      min-height: 0;
      margin: auto;
      transform: scale(1.25);
      transform-origin: center;
      gap: 11px !important;
    }

    .app-shell>nav {
      width: 78px !important;
      min-width: 78px !important;
    }

    .app-shell>main,
    .home-dashboard-content {
      min-width: 0;
      min-height: 0;
    }

    .home-chat-panel {
      width: 306px;
      background: #060b11;
      color: #f8fafc;
      border-left: 0;
      border-radius: 21px;
      box-shadow: 0 7px 18px rgba(0, 0, 0, 0.34);
      overflow: hidden;
      position: relative;
      margin: 14px 14px 14px 0;
    }

    .home-chat-header {
      min-height: 67px;
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(104, 122, 145, 0.18);
      position: relative;
      z-index: 1;
    }

    .home-chat-avatar {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      object-fit: contain;
    }

    .home-chat-heading {
      display: flex;
      flex-direction: column;
      line-height: 1.02;
      flex: 1;
    }

    .home-chat-title {
      color: #f8fafc;
      font: 700 15px/1 Helvetica, Arial, sans-serif;
      letter-spacing: -0.02em;
    }

    .home-chat-powered {
      margin-top: 4px;
      color: #ff690d;
      font-size: 9px;
      line-height: 1;
      font-weight: 800;
    }

    .home-chat-reset {
      width: 24px;
      height: 24px;
      padding: 0;
      color: #8090a4;
      background: transparent;
      border: 0;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: color 0.15s ease, transform 0.15s ease;
    }

    .home-chat-reset:hover {
      color: #f8fafc;
      transform: rotate(-25deg);
    }

    .home-chat-body {
      flex: 1;
      min-height: 0;
      position: relative;
      background:
        radial-gradient(circle at 59% 43%, rgba(233, 89, 3, 0.76) 0, rgba(181, 62, 0, 0.38) 13%, rgba(75, 31, 8, 0.18) 25%, transparent 47%),
        radial-gradient(circle at 62% 45%, rgba(255, 117, 22, 0.17), transparent 31%),
        #060b11;
    }

    .home-chat-body::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(6, 11, 17, 0.03) 0%, rgba(6, 11, 17, 0.1) 62%, rgba(6, 11, 17, 0.62) 100%);
    }

    .home-chat-footer {
      position: relative;
      z-index: 1;
      padding: 10px 16px 14px;
      background: #060b11;
    }

    .home-chat-footer-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #8895a8;
      font-size: 9px;
      font-weight: 800;
      line-height: 1;
      text-transform: uppercase;
    }

    .home-chat-footer-label::after {
      content: '';
      height: 1px;
      flex: 1;
      background: rgba(133, 148, 169, 0.24);
    }

    .home-chat-quick-list {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .home-chat-quick-button {
      width: 100%;
      min-height: 22px;
      padding: 0 12px 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 0;
      border-radius: 999px;
      color: #f5f7fa;
      background: #18212d;
      font: 500 10px/1 Helvetica, Arial, sans-serif;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .home-chat-quick-button:hover {
      background: #222f3e;
      transform: translateX(2px);
    }

    .home-chat-quick-button svg {
      width: 13px;
      height: 13px;
      flex: 0 0 13px;
      color: #b4beca;
    }

    /* Reference-matched home dashboard content */
    .home-dashboard-content {
      padding: 24px 30px 22px !important;
      color: #050505;
    }

    .home-dashboard-header {
      margin-bottom: 21px;
    }

    .home-dashboard-eyebrow {
      display: block;
      color: #ff4a1f;
      font-size: 15px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.015em;
    }

    .home-dashboard-title {
      margin-top: 5px;
      color: #050505;
      font: 700 31px/0.98 Helvetica, Arial, sans-serif;
      letter-spacing: -0.055em;
    }

    .home-dashboard-subtitle {
      margin-top: 6px;
      color: #435a7b;
      font-size: 14px;
      line-height: 1.2;
    }

    .home-stat-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 19px;
      margin-bottom: 23px;
    }

    .home-stat-card {
      min-height: 123px;
      padding: 24px 25px;
      display: flex;
      align-items: center;
      gap: 17px;
      border: 1px solid #b8cbe2;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.02);
      box-shadow: 0 3px 3px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .home-stat-card:hover,
    .home-tool-card:hover,
    .home-recent-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 7px rgba(0, 0, 0, 0.12);
    }

    .home-stat-card.cards-stat {
      border-color: #ffad9d;
    }

    .home-stat-icon,
    .home-tool-icon,
    .home-activity-icon {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 50%;
    }

    .home-stat-icon {
      width: 43px;
      height: 43px;
      color: #3e6da9;
      background: #c4d5ed;
    }

    .home-stat-card.cards-stat .home-stat-icon {
      color: #ff522c;
      background: #ffb4a4;
    }

    .home-stat-icon svg {
      width: 24px;
      height: 24px;
    }

    .home-stat-copy {
      min-width: 0;
    }

    .home-stat-label {
      display: block;
      color: #416da5;
      font-size: 11px;
      line-height: 1;
      font-family: 'Helvetica Rounded', 'Arial Rounded MT Bold', Helvetica, Arial, sans-serif;
      font-weight: 700;
    }

    .home-stat-card.cards-stat .home-stat-label {
      color: #ff4b25;
    }

    .home-stat-value {
      margin-top: 8px;
      color: #050505;
      font: 700 27px/0.95 'Helvetica Rounded', 'Arial Rounded MT Bold', Helvetica, Arial, sans-serif;
      letter-spacing: -0.04em;
    }

    .home-stat-description {
      display: block;
      margin-top: 7px;
      color: #435a7b;
      font-size: 11px;
      line-height: 1.1;
    }

    .home-tools-section {
      margin-bottom: 31px;
    }

    .home-tools-heading {
      color: #050505;
      font: 700 23px/1 Helvetica, Arial, sans-serif;
      letter-spacing: -0.045em;
    }

    .home-tools-subtitle {
      margin-top: 5px;
      color: #435a7b;
      font-size: 11px;
      line-height: 1.2;
    }

    .home-tools-grid {
      display: grid;
      grid-template-columns: repeat(2, 230px);
      gap: 16px;
      margin-top: 17px;
    }

    .home-tool-card {
      min-height: 181px;
      padding: 16px 27px 17px;
      border: 1px solid #b9b9b9;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.02);
      box-shadow: 0 3px 3px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .home-tool-icon {
      width: 43px;
      height: 43px;
      color: #e9c735;
      background: #fff0a7;
    }

    .home-tool-card.bomb-tool .home-tool-icon {
      color: #ff651d;
      background: #ffc08c;
    }

    .home-tool-icon svg {
      width: 24px;
      height: 24px;
    }

    .home-tool-title {
      margin-top: 10px;
      color: #050505;
      font: 700 18px/1 Helvetica, Arial, sans-serif;
      letter-spacing: -0.035em;
    }

    .home-tool-description {
      margin-top: 8px;
      min-height: 25px;
      color: #435a7b;
      font-size: 11px;
      line-height: 1.25;
    }

    .home-tool-button,
    .home-activity-button {
      border: 0;
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 3px 4px rgba(0, 0, 0, 0.2);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .home-tool-button:hover,
    .home-activity-button:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    .home-tool-button {
      height: 34px;
      margin-top: 11px;
      padding: 0 15px 0 16px;
      display: inline-flex;
      align-items: center;
      gap: 13px;
      border-radius: 999px;
      background: #f0cd37;
    }

    .home-tool-card.bomb-tool .home-tool-button {
      background: #ff6816;
    }

    .home-tool-button svg,
    .home-activity-button svg {
      width: 16px;
      height: 16px;
    }

    .home-recent-card {
      min-height: 136px;
      padding: 14px 27px 15px;
      border: 1px solid #b9b9b9;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.02);
      box-shadow: 0 3px 3px rgba(0, 0, 0, 0.1);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .home-recent-heading {
      color: #050505;
      font: 700 16px/1 Helvetica, Arial, sans-serif;
      letter-spacing: -0.025em;
    }

    .home-recent-subtitle {
      margin-top: 6px;
      color: #435a7b;
      font-size: 11px;
      line-height: 1;
    }

    .home-recent-divider {
      height: 1px;
      margin-top: 11px;
      background: rgba(121, 121, 121, 0.28);
    }

    .home-recent-row {
      min-height: 52px;
      display: flex;
      align-items: center;
      gap: 17px;
    }

    .home-activity-icon {
      width: 38px;
      height: 38px;
      color: #ff5531;
      background: #ffb5a5;
    }

    .home-activity-icon svg {
      width: 21px;
      height: 21px;
    }

    .home-activity-copy {
      flex: 1;
      min-width: 0;
    }

    .home-activity-title {
      color: #050505;
      font-size: 12px;
      line-height: 1;
      font-weight: 900;
    }

    .home-activity-meta {
      margin-top: 4px;
      color: #435a7b;
      font-size: 11px;
      line-height: 1;
    }

    .home-activity-button {
      height: 34px;
      padding: 0 13px 0 16px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 999px;
      background: #ff4b25;
    }

    /* Every bold treatment uses the rounded Helvetica family. */
    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    strong,
    b,
    [class~="font-semibold"],
    [class~="font-bold"],
    [class~="font-extrabold"],
    [class~="font-black"] {
      font-family: var(--font-helvetica-rounded) !important;
    }

    .home-chat-title,
    .home-chat-powered,
    .home-dashboard-eyebrow,
    .home-dashboard-title,
    .home-stat-label,
    .home-stat-value,
    .home-tools-heading,
    .home-tool-title,
    .home-tool-button,
    .home-recent-heading,
    .home-activity-title,
    .home-activity-button,
    .game-view-eyebrow,
    .game-view-title,
    .game-section-title,
    .game-deck-name,
    .game-setting-name,
    .game-summary-title,
    .game-launch-button {
      font-family: var(--font-helvetica-rounded) !important;
    }

    /* Game Mode reference layout */
    .game-view {
      height: 100%;
      padding: 23px 22px 22px;
      overflow-y: auto;
      background: #d9d9d9;
      color: #070707;
    }

    .game-view-header {
      margin-bottom: 23px;
    }

    .game-view-eyebrow {
      display: block;
      color: #ff4b25;
      font-size: 11px;
      line-height: 1;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.01em;
    }

    .game-view-title {
      margin-top: 6px;
      color: #050505;
      font: 700 27px/0.98 Helvetica, Arial, sans-serif;
      letter-spacing: -0.045em;
    }

    .game-view-subtitle {
      margin-top: 7px;
      color: #435a7b;
      font-size: 11px;
      line-height: 1.15;
    }

    .game-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 24px;
      align-items: start;
    }

    .game-left-column {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 28px;
      padding-top: 21px;
    }

    .game-section-card {
      padding: 16px 15px 20px;
      border: 1px solid #b8b8b8;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.02);
      box-shadow: 0 3px 3px rgba(0, 0, 0, 0.16);
    }

    .game-section-title {
      color: #090909;
      font: 700 15px/1 Helvetica, Arial, sans-serif;
      letter-spacing: -0.02em;
    }

    .game-section-subtitle {
      margin-top: 5px;
      color: #435a7b;
      font-size: 11px;
      line-height: 1;
    }

    .game-deck-selector {
      min-height: 69px;
      margin-top: 15px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 13px;
      border: 1px solid #b8cee9;
      border-radius: 18px;
      background: #cdd8e7;
    }

    .game-deck-icon {
      width: 49px;
      height: 49px;
      flex: 0 0 49px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #3f72b3;
      background: #d9e4f4;
    }

    .game-deck-icon svg {
      width: 26px;
      height: 26px;
    }

    .game-deck-copy {
      flex: 1;
      min-width: 0;
    }

    .game-deck-name {
      color: #080808;
      font: 700 15px/1 Helvetica, Arial, sans-serif;
    }

    .game-deck-meta {
      margin-top: 4px;
      color: #435a7b;
      font-size: 9px;
      line-height: 1;
    }

    .game-deck-select-wrap {
      position: relative;
      flex: 0 0 auto;
    }

    .game-deck-select {
      width: 92px;
      height: 31px;
      appearance: none;
      padding: 0 27px 0 14px;
      border: 0;
      border-radius: 999px;
      color: #ffffff;
      background: #4e78b0;
      font-size: 9px;
      font-weight: 800;
      outline: none;
      cursor: pointer;
    }

    .game-deck-select-wrap svg {
      position: absolute;
      width: 12px;
      height: 12px;
      top: 9px;
      right: 10px;
      pointer-events: none;
      color: #ffffff;
    }

    .game-settings-card {
      padding: 16px 11px 19px;
    }

    .game-settings-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px 12px;
      margin-top: 15px;
    }

    .game-setting {
      min-height: 70px;
      padding: 10px 11px;
      display: flex;
      align-items: flex-start;
      gap: 9px;
      border: 1px solid #b8b8b8;
      border-radius: 18px;
    }

    .game-setting-icon {
      width: 31px;
      height: 31px;
      flex: 0 0 31px;
      display: grid;
      place-items: center;
      border-radius: 50%;
    }

    .game-setting-icon svg {
      width: 19px;
      height: 19px;
    }

    .game-setting.lives .game-setting-icon {
      color: #ff4f2e;
      background: #ffb0a0;
    }

    .game-setting.time .game-setting-icon {
      color: #17739f;
      background: #a8d6ea;
    }

    .game-setting.order .game-setting-icon {
      color: #7734d0;
      background: #c4a7e9;
    }

    .game-setting.type .game-setting-icon {
      color: #229d53;
      background: #a5e2b7;
    }

    .game-setting-content {
      min-width: 0;
      flex: 1;
    }

    .game-setting-name {
      color: #090909;
      font: 700 14px/1 Helvetica, Arial, sans-serif;
    }

    .game-setting-help {
      margin-top: 3px;
      color: #435a7b;
      font-size: 9px;
      line-height: 1.05;
      white-space: nowrap;
    }

    .game-options {
      display: flex;
      gap: 9px;
      margin-top: 8px;
    }

    .game-option {
      min-width: 34px;
      height: 23px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      color: #111111;
      background: #c9c9c9;
      font-size: 8px;

    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      toggleMute() {
        this.muted = !this.muted;
        return this.muted;
      }
      tick() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.05);
        } catch (e) { }
      }
      correct() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.07);
            gain.gain.setValueAtTime(0.12, this.ctx.currentTime + idx * 0.07);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.07 + 0.16);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + idx * 0.07);
            osc.stop(this.ctx.currentTime + idx * 0.07 + 0.16);
          });
        } catch (e) { }
      }
      wrong() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, this.ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(80, this.ctx.currentTime + 0.22);
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.22);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.22);
        } catch (e) { }
      }
      detonation() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const bufferSize = this.ctx.sampleRate * 0.45;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(500, this.ctx.currentTime);
          filter.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.45);
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.28, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.45);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start();
          noise.stop(this.ctx.currentTime + 0.45);
        } catch (e) { }
      }
    }

      const handleLaunchArena = () => {

          }

        if (combinedCards.length === 0) {

        // Apply format filter
        if (gameFormat === 'MCQ') {

        } else if (gameFormat === 'ID') {
          combinedCards = combinedCards.filter(c => c.type === 'IDENTIFICATION');

        if (combinedCards.length === 0) {
          alert('No cards match the selected Game Format filter.');
          return;

        // Apply ordering
        if (questionOrder === 'SHUFFLE') {
          combinedCards = [...combinedCards].sort(() => Math.random() - 0.5);

        setArenaDeckQueue(combinedCards);

        setArenaScore(0);

        setArenaHistory([]);

        setActiveTab('arena');

      // Start countdown timer when in arena
      useEffect(() => {

          if (arenaTimerRef.current) clearInterval(arenaTimerRef.current);
          return;
        }

        setArenaTimeRemaining(countdownSpeed);

        if (arenaTimerRef.current) clearInterval(arenaTimerRef.current);
        arenaTimerRef.current = setInterval(() => {
          setArenaTimeRemaining(prev => {
            if (prev <= 0.1) {
              clearInterval(arenaTimerRef.current);
              handleTimeout();
              return 0;
            }
            // Tick sound in danger zone (< 5s)
            if (prev <= 5.0 && Math.round(prev * 10) % 10 === 0) {
              sound.tick();
            }
            return Math.max(0, prev - 0.1);
          });
        }, 100);

        return () => {
          if (arenaTimerRef.current) clearInterval(arenaTimerRef.current);
        };
      }, [activeTab, arenaQIndex, arenaStatus, countdownSpeed]);

      // Focus text input on identification questions
      useEffect(() => {
        if (activeTab === 'arena' && arenaStatus === 'PLAYING') {
          const currentQ = arenaDeckQueue[arenaQIndex];
          if (currentQ && currentQ.type === 'IDENTIFICATION' && idInputRef.current) {
            idInputRef.current.focus();
          }
        }
      }, [activeTab, arenaQIndex, arenaStatus, arenaDeckQueue]);

      const handleTimeout = () => {
        sound.wrong();
        sound.detonation();
        const currentQ = arenaDeckQueue[arenaQIndex];

        setArenaHistory(prev => [
          ...prev,
          {
            prompt: currentQ.prompt,
            format: currentQ.type,
            userAns: '(Timed Out)',
            correctAns: currentQ.correctAnswer,
            isRight: false
          }
        ]);

        const nextLives = arenaLives - 1;
        setArenaLives(nextLives);
        setArenaStreak(0);

        if (nextLives <= 0) {
          setArenaStatus('DETONATED');
        } else {
          setTimeout(() => {
            advanceQuestion();
          }, 600);
        }
      };

      const handleAnswerMCQ = (choiceIdx) => {
        if (arenaIsAnswering || arenaStatus !== 'PLAYING') return;
        setArenaIsAnswering(true);
        setArenaSelectedChoice(choiceIdx);

        const currentQ = arenaDeckQueue[arenaQIndex];
        const isRight = (choiceIdx === currentQ.correctIndex);

        if (isRight) {
          sound.correct();
          const newStreak = arenaStreak + 1;
          setArenaStreak(newStreak);
          if (newStreak > arenaMaxStreak) setArenaMaxStreak(newStreak);
          setArenaScore(s => s + 500 + newStreak * 50);

          setArenaHistory(prev => [
            ...prev,
            {
              prompt: currentQ.prompt,
              format: currentQ.type,
              userAns: currentQ.options[choiceIdx],
              correctAns: currentQ.correctAnswer,
              isRight: true
            }
          ]);

          setTimeout(() => {
            advanceQuestion();
          }, 500);
        } else {
          sound.wrong();
          const nextLives = arenaLives - 1;
          setArenaLives(nextLives);
          setArenaStreak(0);

          setArenaHistory(prev => [
            ...prev,
            {
              prompt: currentQ.prompt,
              format: currentQ.type,
              userAns: currentQ.options[choiceIdx],
              correctAns: currentQ.correctAnswer,
              isRight: false
            }
          ]);

          setTimeout(() => {
            if (nextLives <= 0) {
              sound.detonation();
              setArenaStatus('DETONATED');
            } else {
              advanceQuestion();
            }
          }, 700);
        }
      };

      const handleAnswerID = (e) => {
        if (e) e.preventDefault();
        if (arenaIsAnswering || arenaStatus !== 'PLAYING' || !arenaIdInput.trim()) return;

        setArenaIsAnswering(true);
        const currentQ = arenaDeckQueue[arenaQIndex];
        const cleanInput = arenaIdInput.trim().toLowerCase();

        let isRight = false;
        if (cleanInput === currentQ.correctAnswer.trim().toLowerCase()) {
          isRight = true;
        } else if (currentQ.alternates) {
          const list = currentQ.alternates.split(',').map(s => s.trim().toLowerCase());
          if (list.includes(cleanInput)) isRight = true;
        }

        if (isRight) {
          sound.correct();
          const newStreak = arenaStreak + 1;
          setArenaStreak(newStreak);
          if (newStreak > arenaMaxStreak) setArenaMaxStreak(newStreak);
          setArenaScore(s => s + 500 + newStreak * 50);

          setArenaHistory(prev => [
            ...prev,
            {
              prompt: currentQ.prompt,
              format: currentQ.type,
              userAns: arenaIdInput.trim(),
              correctAns: currentQ.correctAnswer,
              isRight: true
            }
          ]);

          setTimeout(() => {
            advanceQuestion();
          }, 500);
        } else {
          sound.wrong();
          const nextLives = arenaLives - 1;
          setArenaLives(nextLives);
          setArenaStreak(0);

          setArenaHistory(prev => [
            ...prev,
            {
              prompt: currentQ.prompt,
              format: currentQ.type,
              userAns: arenaIdInput.trim(),
              correctAns: currentQ.correctAnswer,
              isRight: false
            }
          ]);

          setTimeout(() => {
            if (nextLives <= 0) {
              sound.detonation();
              setArenaStatus('DETONATED');
            } else {
              advanceQuestion();
            }
          }, 700);
        }

      const advanceQuestion = () => {
        setArenaIsAnswering(false);
        setArenaSelectedChoice(null);
        setArenaIdInput('');

        if (arenaQIndex + 1 < arenaDeckQueue.length) {
          setArenaQIndex(i => i + 1);

          setArenaStatus('DEFUSED');

      // Keyboard Controls for Word Bomb Arena (A,B,C,D, Esc) and Flashcards (Space, Left, Right)
      useEffect(() => {
        const handleKeyDown = (e) => {
          const tag = e.target?.tagName?.toLowerCase();
          if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

          if (activeTab === 'arena' && arenaStatus === 'PLAYING') {
            if (e.key === 'Escape') {
              setActiveTab('game');
              return;
            }
            const currentQ = arenaDeckQueue[arenaQIndex];
            if (currentQ && currentQ.type === 'MULTIPLE_CHOICE' && !arenaIsAnswering) {
              const keyMap = { 'a': 0, 'A': 0, '1': 0, 'b': 1, 'B': 1, '2': 1, 'c': 2, 'C': 2, '3': 2, 'd': 3, 'D': 3, '4': 3 };
              if (e.key in keyMap) {
                const choiceIdx = keyMap[e.key];
                if (currentQ.options && choiceIdx < currentQ.options.length) {
                  e.preventDefault();
                  handleAnswerMCQ(choiceIdx);
                }
              }
            }
          }

          if (activeTab === 'flashcards') {
            if (e.code === 'Space') {
              e.preventDefault();
              setFlashcardFlipped(f => !f);
            } else if (e.key === 'ArrowLeft') {
              e.preventDefault();
              setFlashcardIndex(idx => Math.max(0, idx - 1));
              setFlashcardFlipped(false);
            } else if (e.key === 'ArrowRight') {
              e.preventDefault();

              setFlashcardFlipped(false);
            }
          }
        };

        return () => window.removeEventListener('keydown', handleKeyDown);

      const activeArenaQ = arenaDeckQueue[arenaQIndex];
      const isArenaDanger = arenaTimeRemaining <= 5.0 && arenaStatus === 'PLAYING';
      const fusePercent = Math.max(0, Math.min(100, (arenaTimeRemaining / countdownSpeed) * 100));

      const renderLibraryDeckCard = (deck) => {
        const cardCount = deck.cards?.length || 0;

        const totalMaterials = cardCount + documentCount;
        return (
          <article
            key={deck.id}
            className="csm-library-deck-card"

          >
            <div className="csm-library-deck-card-top">

            <div className="csm-library-deck-card-copy">

                <p>{deleteConfirmation.message}</p>
                <div className="csm-delete-actions"><button type="button" className="csm-secondary-button" onClick={() => setDeleteConfirmation(null)}>Cancel</button><button type="button" className="csm-danger-button" onClick={confirmDeleteAction}>{deleteConfirmation.confirmLabel}</button></div>
              </div>
            </div>
          )}

          {changeConfirmation && (
            <div className="csm-modal-backdrop" role="presentation" onClick={() => setChangeConfirmation(null)}>
              <div className="csm-change-modal" role="dialog" aria-modal="true" aria-labelledby="change-confirmation-title" onClick={(e) => e.stopPropagation()}>
                <div className="csm-change-icon" aria-hidden="true">✓</div>
                <span className="csm-kicker">CHANGE CONFIRMED</span>
                <h2 id="change-confirmation-title">{changeConfirmation.title}</h2>
                <p>{changeConfirmation.message}</p>
                <button type="button" className="csm-primary-button" onClick={() => setChangeConfirmation(null)}>Done</button>
              </div>
            </div>
          )}

          {passwordResetModalOpen && (
            <div className="csm-modal-backdrop" role="presentation" onClick={() => setPasswordResetModalOpen(false)}>
              <div className="csm-password-modal" role="dialog" aria-modal="true" aria-labelledby="password-reset-title" onClick={(e) => e.stopPropagation()}>
                <div className="csm-password-icon" aria-hidden="true">•••</div>
                <span className="csm-kicker">PASSWORD RESET</span>
                <h2 id="password-reset-title">Reset password placeholder</h2>
                <p>Password reset is ready for the account flow, but it needs the database and email service before it can send a real reset link.</p>
                <button type="button" className="csm-primary-button" onClick={() => { setPasswordResetModalOpen(false); triggerToast('Password reset placeholder acknowledged'); }}>Got it</button>
              </div>
            </div>
          )}

          {/* ========================================================
              POPUP: ADD MATERIAL (VAIA Hierarchy + CSM Design Premise)
              ======================================================== */}
          {isAddMaterialPopupOpen && (
            <div
              className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn"
              onClick={() => setIsAddMaterialPopupOpen(false)}
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="w-full max-w-md bg-white rounded-[26px] p-6 sm:p-7 shadow-2xl border border-slate-200 flex flex-col relative"
              >
                {/* Header */}
                <div className="flex items-center justify-between pb-4 border-b border-slate-100">
                  <div>
                    <span className="text-[10px] font-extrabold text-[#f04824] uppercase tracking-wider block">ADD MATERIAL</span>
                    <h3 className="text-xl font-black text-slate-900 tracking-tight">
                      {targetDeckForAddMaterial ? (targetDeckForAddMaterial.code || targetDeckForAddMaterial.title) : 'Reviewer Materials'}
                    </h3>
                  </div>
                  <button
                    onClick={() => setIsAddMaterialPopupOpen(false)}
                    className="w-8 h-8 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-500 hover:text-slate-900 transition-colors cursor-pointer text-xl"
                    title="Close"
                  >
                    &times;
                  </button>
                </div>

                {/* Hidden File Input */}
                <input
                  ref={addMaterialFileInputRef}
                  type="file"
                  accept=".pdf,application/pdf"
                  multiple
                  onChange={(e) => handleAddMaterialDirectUpload(e.target.files)}
                  className="hidden"
                />

                {/* 1. Primary Upload / Drag File Area */}
                <div className="mt-5">
                  <div
                    onDragOver={(e) => { e.preventDefault(); setIsDraggingAddMaterialFile(true); }}
                    onDragLeave={() => setIsDraggingAddMaterialFile(false)}
                    onDrop={(e) => {
                      e.preventDefault();
                      setIsDraggingAddMaterialFile(false);
                      handleAddMaterialDirectUpload(e.dataTransfer.files);
                    }}
                    onClick={() => addMaterialFileInputRef.current?.click()}
                    className={`p-6 sm:p-7 rounded-2xl border-2 border-dashed transition-all text-center cursor-pointer flex flex-col items-center justify-center ${isDraggingAddMaterialFile
                        ? 'border-[#f04824] bg-orange-50/60 shadow-inner'
                        : 'border-slate-300/80 bg-[#f8f9fa] hover:bg-[#fff9f8] hover:border-[#f04824]/50'
                      }`}
                  >
                    <div className="w-12 h-12 rounded-2xl bg-white border border-slate-200 shadow-sm flex items-center justify-center text-[#f04824] mb-3">
                      <IconUpload className="w-6 h-6" />
                    </div>
                    <h4 className="text-sm font-black text-slate-900">Drag or upload file here</h4>
                    <p className="text-xs text-slate-400 mt-1">
                      Supported format — PDF documents & lecture slides
                    </p>
                    <button
                      type="button"
                      onClick={(e) => {
                        e.stopPropagation();
                        addMaterialFileInputRef.current?.click();
                      }}
                      className="mt-4 h-9 px-5 bg-white hover:bg-slate-50 text-slate-800 border border-slate-200 text-xs font-bold rounded-full inline-flex items-center gap-2 shadow-sm transition-all cursor-pointer"
                    >
                      <IconUpload className="w-3.5 h-3.5 text-[#f04824]" />
                      <span>Upload File</span>
                    </button>
                  </div>
                </div>

                {/* Divider with 'OR' */}
                <div className="flex items-center gap-3 my-5">
                  <div className="flex-1 border-t border-slate-200/90" />
                  <span className="text-[11px] font-extrabold tracking-widest text-slate-400 uppercase">OR</span>
                  <div className="flex-1 border-t border-slate-200/90" />
                </div>

                {/* 2 & 3. Options Grid */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {/* Option 2: Create Bombcards Manually */}
                  <div
                    onClick={handleChooseManualCreation}
                    className="bg-[#f8f9fa] hover:bg-white border border-slate-200/90 hover:border-slate-300 rounded-2xl p-4 shadow-sm hover:shadow-md transition-all cursor-pointer flex flex-col justify-between group text-left"
                  >
                    <div className="w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center mb-3 group-hover:bg-[#f04824] transition-colors shadow-sm">
                      <IconCards className="w-5 h-5" />
                    </div>
                    <div>
                      <h4 className="text-xs font-black text-slate-900 group-hover:text-[#f04824] transition-colors">
                        Create Bombcards Manually
                      </h4>
                      <p className="text-[11px] text-slate-400 mt-0.5">
                        Create your own Bombcards
                      </p>
                    </div>
                  </div>

                  {/* Option 3: Generate AI Bombcards (COMING SOON / DISABLED) */}
                  <div
                    onClick={(e) => { e.preventDefault(); e.stopPropagation(); }}
                    className="bg-[#f8f9fa] border border-slate-200/80 rounded-2xl p-4 flex flex-col justify-between relative overflow-hidden select-none cursor-not-allowed group"
                    title="Coming soon"
                  >
                    {/* Visually blurred / reduced emphasis content */}
                    <div className="opacity-35 blur-[1.5px] flex flex-col pointer-events-none">
                      <div className="w-10 h-10 rounded-xl bg-purple-600/20 text-purple-600 flex items-center justify-center mb-3">
                        <IconSparkles className="w-5 h-5" />
                      </div>
                      <div>
                        <h4 className="text-xs font-black text-slate-900">
                          Generate AI Bombcards
                        </h4>
                        <p className="text-[11px] text-slate-400 mt-0.5">
                          Generate flashcards with AI
                        </p>
                      </div>
                    </div>

                    {/* Prominent COMING SOON Badge Overlay */}
                    <div className="absolute inset-0 flex items-center justify-center bg-white/40 backdrop-blur-[1px]">
                      <span className="px-3 py-1 bg-slate-900 text-white text-[10px] font-black uppercase tracking-wider rounded-full shadow-md border border-slate-700/30">
                        Coming Soon
                      </span>
                    </div>
                  </div>
                </div>

              </div>
            </div>
          )}

          {/* ========================================================
              DRAWER / MODAL: BOMBCARD & DECK AUTHORING WORKSHOP
              ======================================================== */}
          {isDeckEditorOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-2xl bg-white rounded-[26px] p-6 sm:p-8 shadow-2xl border border-slate-200 flex flex-col max-h-[90vh]">

                {/* Header */}
                <div className="flex items-center justify-between pb-4 border-b border-slate-100">
                  <div>
                    <span className="text-[10px] font-bold text-[#f04824] uppercase tracking-wider block">ADD MATERIAL</span>
                    <h3 className="text-xl font-extrabold text-slate-900">
                      {editingDeck ? (editingDeck.code || editingDeck.title) : 'Reviewer Materials'}
                    </h3>
                    <p className="text-xs text-slate-400 mt-0.5">
                      Target Folder: <span className="font-semibold text-slate-700">{editingDeck?.code} - {editingDeck?.title || editingDeck?.subject}</span>
                    </p>
                  </div>
                  <button
                    onClick={() => setIsDeckEditorOpen(false)}
                    className="w-8 h-8 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-500 transition-colors"
                  >
                    &times;
                  </button>
                </div>

                {/* Body Form */}
                <div className="flex-1 overflow-y-auto custom-scroll py-4 space-y-5 pr-1">

                  {/* Section 1: Import PDFs */}
                  <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                    <div className="flex items-center justify-between mb-2.5">
                      <div className="flex items-center gap-2">
                        <IconPdf />
                        <span className="text-xs font-bold text-slate-800">
                          Import PDFs ({editorDocuments.length})
                        </span>
                      </div>
                      <button
                        type="button"
                        onClick={() => pdfInputRef.current?.click()}
                        className="h-7 px-3 bg-white hover:bg-slate-100 text-slate-800 border border-slate-200/90 text-xs font-bold rounded-lg transition-colors flex items-center gap-1.5 cursor-pointer shadow-sm"
                      >
                        <IconPlus className="w-3 h-3 text-[#f04824]" />
                        <span>Browse PDF</span>
                      </button>
                    </div>

                    <input
                      ref={pdfInputRef}
                      type="file"
                      accept=".pdf,application/pdf"
                      multiple
                      onChange={handlePdfUpload}
                      className="hidden"
                    />

                    {/* Drag & Drop Upload Zone */}
                    <div
                      onDragOver={(e) => { e.preventDefault(); setIsDraggingPdf(true); }}
                      onDragLeave={() => setIsDraggingPdf(false)}
                      onDrop={(e) => {
                        e.preventDefault();
                        setIsDraggingPdf(false);
                        const files = Array.from(e.dataTransfer.files || []).filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
                        if (files.length > 0) {
                          const newDocs = files.map(file => ({
                            id: 'doc-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6),
                            title: file.name
                          }));
                          setEditorDocuments(prev => [...prev, ...newDocs]);
                          triggerToast(`Imported ${files.length} PDF file${files.length > 1 ? 's' : ''}`);
                        } else {
                          triggerToast('Please drop PDF files only');
                        }
                      }}
                      onClick={() => pdfInputRef.current?.click()}
                      className={`p-5 rounded-xl border-2 border-dashed transition-all text-center cursor-pointer ${isDraggingPdf ? 'border-[#f04824] bg-orange-50/50' : 'border-slate-300/80 bg-white/70 hover:bg-white hover:border-[#f04824]/50'
                        }`}
                    >
                      <div className="flex flex-col items-center justify-center gap-1">
                        <svg className="w-7 h-7 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                          <polyline points="17 8 12 3 7 8" />
                          <line x1="12" y1="3" x2="12" y2="15" />
                        </svg>
                        <p className="text-xs font-bold text-slate-700 mt-1">Click to browse or drag & drop PDF files</p>
                        <p className="text-[11px] text-slate-400">Attach lecture modules, handouts, or notes</p>
                      </div>
                    </div>

                    {/* Attached PDFs List */}
                    {editorDocuments.length > 0 && (
                      <div className="mt-3 space-y-1.5 max-h-36 overflow-y-auto custom-scroll pr-1">
                        {editorDocuments.map(doc => (
                          <div key={doc.id} className="p-2.5 bg-white border border-slate-200/90 rounded-xl flex items-center justify-between text-xs hover:border-slate-300 transition-colors">
                            <div className="flex items-center gap-2.5 min-w-0 flex-1 pr-2">
                              <IconPdf />
                              <span className="font-bold text-slate-800 truncate">{doc.title}</span>
                            </div>
                            <button
                              type="button"
                              onClick={() => handleRemoveDocFromEditor(doc.id)}
                              className="text-slate-400 hover:text-red-500 p-1 rounded hover:bg-slate-100 transition-colors"
                              title="Remove PDF"
                            >
                              <IconTrash className="w-3.5 h-3.5" />
                            </button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  {/* Sub-Form: Add New BombCard */}
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <span className="text-[11px] font-bold text-[#f04824] uppercase tracking-wider block mb-2">
                      + Add Question Pair (BombCard)
                    </span>

                    {/* Question Type Toggle */}
                    <div className="flex items-center gap-2 mb-3">
                      <button
                        type="button"
                        onClick={() => setNewQType('MULTIPLE_CHOICE')}
                        className={`h-7 px-3 rounded-md text-xs font-bold transition-colors ${newQType === 'MULTIPLE_CHOICE' ? 'bg-slate-900 text-white' : 'bg-white text-slate-600 border border-slate-200'
                          }`}
                      >
                        Multiple Choice
                      </button>
                      <button
                        type="button"
                        onClick={() => setNewQType('IDENTIFICATION')}
                        className={`h-7 px-3 rounded-md text-xs font-bold transition-colors ${newQType === 'IDENTIFICATION' ? 'bg-slate-900 text-white' : 'bg-white text-slate-600 border border-slate-200'
                          }`}
                      >
                        Identification
                      </button>
                    </div>

                    <div className="space-y-2.5">
                      <input
                        type="text"
                        value={newQPrompt}
                        onChange={(e) => setNewQPrompt(e.target.value)}
                        placeholder="Enter Question / Prompt..."
                        className="w-full h-9 px-3 bg-white border border-slate-200 rounded-lg text-xs outline-none focus:border-[#f04824]"
                      />

                      <input
                        type="text"
                        value={newQHint}
                        onChange={(e) => setNewQHint(e.target.value)}
                        placeholder="Optional Hint / Module Tag (e.g. 4 Letters, Chapter 1)..."
                        className="w-full h-9 px-3 bg-white border border-slate-200 rounded-lg text-xs outline-none focus:border-[#f04824]"
                      />

                      {/* Mode A: MCQ 4 Options with Radio Key */}
                      {newQType === 'MULTIPLE_CHOICE' ? (
                        <div className="space-y-1.5 pt-1">
                          <span className="text-[11px] font-medium text-slate-500 block">Select radio to designate the correct answer:</span>
                          {newQOptions.map((opt, i) => (
                            <div key={i} className="flex items-center gap-2">
                              <input
                                type="radio"
                                name="correctKey"
                                checked={newQCorrectIndex === i}
                                onChange={() => setNewQCorrectIndex(i)}
                                className="w-4 h-4 text-[#f04824] focus:ring-[#f04824] cursor-pointer"
                              />
                              <span className="text-xs font-bold text-slate-400 w-4">{String.fromCharCode(65 + i)}</span>
                              <input
                                type="text"
                                value={opt}
                                onChange={(e) => {
                                  const copy = [...newQOptions];
                                  copy[i] = e.target.value;
                                  setNewQOptions(copy);
                                }}
                                placeholder={`Option ${String.fromCharCode(65 + i)}`}
                                className="flex-1 h-8 px-2.5 bg-white border border-slate-200 rounded-lg text-xs outline-none focus:border-[#f04824]"
                              />
                            </div>
                          ))}
                        </div>
                      ) : (
                        /* Mode B: Identification Single & Alternates */
                        <div className="space-y-2 pt-1">
                          <div>
                            <label className="text-[11px] font-medium text-slate-500 block mb-1">Target Answer:</label>
                            <input
                              type="text"
                              value={newQAnswer}
                              onChange={(e) => setNewQAnswer(e.target.value)}
                              placeholder="e.g. Star"
                              className="w-full h-8 px-2.5 bg-white border border-slate-200 rounded-lg text-xs outline-none focus:border-[#f04824]"
                            />
                          </div>
                          <div>
                            <label className="text-[11px] font-medium text-slate-500 block mb-1">Alternate acceptable answers (comma-separated):</label>
                            <input
                              type="text"
                              value={newQAlternates}
                              onChange={(e) => setNewQAlternates(e.target.value)}
                              placeholder="e.g. star, star topology"
                              className="w-full h-8 px-2.5 bg-white border border-slate-200 rounded-lg text-xs outline-none focus:border-[#f04824]"
                            />
                          </div>
                        </div>
                      )}

                      <button
                        type="button"
                        onClick={handleAddQuestionToEditor}
                        className="mt-2 h-8 px-4 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold rounded-lg transition-colors"
                      >
                        + Append Card to Deck
                      </button>
                    </div>
                  </div>

                  {/* Existing BombCards in this Deck */}
                  <div>
                    <span className="text-xs font-bold text-slate-700 block mb-2">
                      Questions in this Deck ({editorCards.length})
                    </span>
                    <div className="space-y-2 max-h-48 overflow-y-auto custom-scroll pr-1">
                      {editorCards.length === 0 ? (
                        <div className="text-xs text-slate-400 italic py-2">No cards added yet.</div>
                      ) : (
                        editorCards.map((c, idx) => (
                          <div key={c.id} className="p-3 bg-white border border-slate-200 rounded-xl flex items-center justify-between text-xs">
                            <div className="flex-1 pr-2">
                              <span className="font-bold text-slate-900 block">Q{idx + 1}: {c.prompt}</span>
                              <span className="text-[11px] text-slate-500 ">
                                Ans: {c.correctAnswer} &bull; Type: {c.type === 'MULTIPLE_CHOICE' ? 'MCQ' : 'ID'}
                              </span>
                            </div>
                            <button
                              onClick={() => handleRemoveCardFromEditor(c.id)}
                              className="text-rose-500 hover:text-rose-700 font-bold p-1"
                              title="Remove Card"
                            >
                              <IconTrash />
                            </button>
                          </div>
                        ))
                      )}
                    </div>
                  </div>

                </div>

                {/* Footer Actions */}
                <div className="pt-4 border-t border-slate-100 flex items-center justify-end gap-2">
                  <button
                    onClick={() => setIsDeckEditorOpen(false)}
                    className="h-10 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition-colors"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={handleSaveDeck}
                    className="h-10 px-5 bg-[#f04824] hover:bg-[#e03e1b] text-white text-xs font-bold rounded-xl shadow-md transition-colors"
                  >
                    Save Materials
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>

</html>
