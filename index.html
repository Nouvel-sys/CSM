<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Co-StudyMaxx — Study reviewers, made to stick</title>
  <meta name="description"
    content="Create private study reviewers, practice what you missed, and turn every deck into a focused countdown quiz.">

  <!-- Typography: Plus Jakarta Sans (Body/UI), Outfit (Display/Headings), JetBrains Mono (Timer/Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'system-ui', '-apple-system', 'sans-serif'],
            display: ['Outfit', 'Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            brand: {
              orange: '#f04824',
              orangeHover: '#e03e1b',
              orangeLight: '#fff1ee',
              orangeBorder: '#ffd7cf',
              charcoal: '#181818',
              charcoalSurface: '#222222',
              charcoalBorder: '#2e2e2e',
              canvas: '#f4f5f7',
              canvasSurface: '#ffffff',
              canvasBorder: '#e5e7eb'
            }
          },
          keyframes: {
            shakeDanger: {
              '0%, 100%': { transform: 'translateX(0) rotate(0deg)' },
              '20%': { transform: 'translateX(-4px) rotate(-1.5deg)' },
              '40%': { transform: 'translateX(4px) rotate(1.5deg)' },
              '60%': { transform: 'translateX(-3px) rotate(-1deg)' },
              '80%': { transform: 'translateX(3px) rotate(1deg)' },
            },
            shakeError: {
              '0%, 100%': { transform: 'translateX(0)' },
              '20%': { transform: 'translateX(-8px)' },
              '40%': { transform: 'translateX(8px)' },
              '60%': { transform: 'translateX(-6px)' },
              '80%': { transform: 'translateX(6px)' },
            },
            sparkPulse: {
              '0%, 100%': { transform: 'scale(1)', opacity: '1' },
              '50%': { transform: 'scale(1.25)', opacity: '0.8' },
            }
          },
          animation: {
            'shake-danger': 'shakeDanger 0.22s infinite ease-in-out',
            'shake-error': 'shakeError 0.35s ease-in-out',
            'spark-pulse': 'sparkPulse 0.4s infinite ease-in-out',
          }
        }
      }
    };
  </script>

  <!-- React 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="stylesheet" href="index.css">
</head>

<body>
  <div class="outer-glow-backdrop"></div>
  <div id="root" class="relative z-10 w-full h-screen flex items-stretch overflow-hidden"></div>

  <script type="text/babel" src="index.jsx"></script>
</body>

</html>
