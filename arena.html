<body>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ==========================================
    // 1. SOUND SYNTHESIZER (Web Audio API - Offline)
    // ==========================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      toggleMute() {
        this.muted = !this.muted;
        return this.muted;
      }
      tick() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(750, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(350, this.ctx.currentTime + 0.03);
          gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.03);
        } catch (e) {}
      }
      dangerBeep() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(950, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.09, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.005, this.ctx.currentTime + 0.06);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.06);
        } catch (e) {}
      }
      correct() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + i * 0.05);
            gain.gain.setValueAtTime(0.12, now + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.05);
            osc.stop(now + i * 0.05 + 0.25);
          });
        } catch (e) {}
      }
      wrong() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, this.ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(80, this.ctx.currentTime + 0.22);
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.22);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.22);
        } catch (e) {}
      }
      detonation() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const bufferSize = this.ctx.sampleRate * 0.45;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(500, this.ctx.currentTime);
          filter.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.45);
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.45);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start();
          noise.stop(this.ctx.currentTime + 0.45);
        } catch (e) {}
      }
    }

    const sound = new SoundEngine();

    // ==========================================
    // 5. MAIN GAME ARENA COMPONENT
    // ==========================================
    function BombArena() {
      // Game States
      const [currentQIndex, setCurrentQIndex] = useState(0);
      const [lives, setLives] = useState(3);
      const [score, setScore] = useState(0);
      const [streak, setStreak] = useState(0);
      const [maxStreak, setMaxStreak] = useState(0);
      const [timeRemaining, setTimeRemaining] = useState(TIMER_LIMIT);
      const [gameState, setGameState] = useState('PLAYING'); // 'PLAYING', 'DETONATED', 'DEFUSED'
      
      // Feedback states
      const [selectedChoice, setSelectedChoice] = useState(null);
      const [isAnswerCorrect, setIsAnswerCorrect] = useState(null);
      const [isShakingError, setIsShakingError] = useState(false);
      const [soundMuted, setSoundMuted] = useState(false);
      
      // Identification input state
      const [idInput, setIdInput] = useState('');
      const inputRef = useRef(null);

      // Session history log for the End-of-Run report
      const [sessionHistory, setSessionHistory] = useState([]);

      const activeQ = MOCK_DECK[currentQIndex];
      const isDanger = timeRemaining <= 5.0 && timeRemaining > 0;

      // Timer Interval
      useEffect(() => {
        if (gameState !== 'PLAYING') return;

        const interval = setInterval(() => {
          setTimeRemaining((prev) => {
            const next = Math.max(0, prev - 0.1);

            // Tick audio cue
            if (next <= 5.0 && next > 0) {
              if (Math.round(next * 10) % 2 === 0) sound.dangerBeep();
            } else {
              if (Math.round(next * 10) % 10 === 0) sound.tick();
            }

            // Timeout Detonation check
            if (next <= 0) {
              clearInterval(interval);
              handleTimeout();
              return 0;
            }
            return next;
          });
        }, 100);

        return () => clearInterval(interval);
      }, [gameState, currentQIndex]);

      // Focus input on identification mode
      useEffect(() => {
        if (activeQ && activeQ.type === 'IDENTIFICATION' && inputRef.current && gameState === 'PLAYING') {
          inputRef.current.focus();
        }
      }, [currentQIndex, activeQ, gameState]);

      // Keyboard support for Multiple Choice (A, B, C, D) & Escape
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (gameState !== 'PLAYING') return;

          if (activeQ && activeQ.type === 'MULTIPLE_CHOICE') {
            const key = e.key.toUpperCase();
            if (['A', 'B', 'C', 'D'].includes(key)) {
              const idxMap = { A: 0, B: 1, C: 2, D: 3 };
              handleMultipleChoice(idxMap[key]);
            }
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [activeQ, gameState, selectedChoice]);

      // Handle Timeout (Fuse ran out)
      const handleTimeout = () => {
        sound.wrong();
        sound.detonation();

        setSessionHistory((prev) => [
          ...prev,
          {
            question: activeQ.prompt,
            format: activeQ.formatLabel,
            userAnswer: "(Timed Out)",
            correctAnswer: activeQ.correctAnswer,
            isCorrect: false
          }
        ]);

        const nextLives = lives - 1;
        setLives(nextLives);
        setStreak(0);

        if (nextLives <= 0) {
          setGameState('DETONATED');
        } else {
          // Advance to next or loop
          if (currentQIndex + 1 < MOCK_DECK.length) {
            setCurrentQIndex((idx) => idx + 1);
            setTimeRemaining(TIMER_LIMIT);
            setSelectedChoice(null);
            setIdInput('');
          } else {
            setGameState('DEFUSED');
          }
        }
      };

      // Mode A: Multiple Choice Answer Handler
      const handleMultipleChoice = (choiceIdx) => {
        if (selectedChoice !== null || gameState !== 'PLAYING') return;

        setSelectedChoice(choiceIdx);
        const isRight = choiceIdx === activeQ.correctIndex;
        setIsAnswerCorrect(isRight);

        if (isRight) {
          sound.correct();
          const newStreak = streak + 1;
          setStreak(newStreak);
          if (newStreak > maxStreak) setMaxStreak(newStreak);
          setScore((s) => s + 500 + newStreak * 50);

          setSessionHistory((prev) => [
            ...prev,
            {
              question: activeQ.prompt,
              format: activeQ.formatLabel,
              userAnswer: activeQ.options[choiceIdx],
              correctAnswer: activeQ.correctAnswer,
              isCorrect: true
            }
          ]);

          // Pass immediately to next question
          setTimeout(() => {
            if (currentQIndex + 1 < MOCK_DECK.length) {
              setCurrentQIndex((idx) => idx + 1);
              setTimeRemaining(TIMER_LIMIT);
              setSelectedChoice(null);
              setIsAnswerCorrect(null);
            } else {
              setGameState('DEFUSED');
            }
          }, 600);

        } else {
          sound.wrong();
          setIsShakingError(true);
          const nextLives = lives - 1;
          setLives(nextLives);
          setStreak(0);

          setSessionHistory((prev) => [
            ...prev,
            {
              question: activeQ.prompt,
              format: activeQ.formatLabel,
              userAnswer: activeQ.options[choiceIdx],
              correctAnswer: activeQ.correctAnswer,
              isCorrect: false
            }
          ]);

          setTimeout(() => {
            setIsShakingError(false);
            setSelectedChoice(null);
            setIsAnswerCorrect(null);
            if (nextLives <= 0) {
              sound.detonation();
              setGameState('DETONATED');
            }
          }, 700);
        }
      };

      // Mode B: Identification Submit Handler
      const handleIdentificationSubmit = (e) => {
        if (e) e.preventDefault();
        if (gameState !== 'PLAYING' || !idInput.trim()) return;

        const normalizedUser = idInput.trim().toLowerCase();
        const normalizedTarget = activeQ.correctAnswer.trim().toLowerCase();
        const isRight = normalizedUser === normalizedTarget;

        setIsAnswerCorrect(isRight);

        if (isRight) {
          sound.correct();
          const newStreak = streak + 1;
          setStreak(newStreak);
          if (newStreak > maxStreak) setMaxStreak(newStreak);
          setScore((s) => s + 500 + newStreak * 50);

          setSessionHistory((prev) => [
            ...prev,
            {
              question: activeQ.prompt,
              format: activeQ.formatLabel,
              userAnswer: idInput.trim(),
              correctAnswer: activeQ.correctAnswer,
              isCorrect: true
            }
          ]);

          setTimeout(() => {
            if (currentQIndex + 1 < MOCK_DECK.length) {
              setCurrentQIndex((idx) => idx + 1);
              setTimeRemaining(TIMER_LIMIT);
              setIdInput('');
              setIsAnswerCorrect(null);
            } else {
              setGameState('DEFUSED');
            }
          }, 600);

        } else {
          sound.wrong();
          setIsShakingError(true);
          const nextLives = lives - 1;
          setLives(nextLives);
          setStreak(0);

          setSessionHistory((prev) => [
            ...prev,
            {
              question: activeQ.prompt,
              format: activeQ.formatLabel,
              userAnswer: idInput.trim(),
              correctAnswer: activeQ.correctAnswer,
              isCorrect: false
            }
          ]);

          setTimeout(() => {
            setIsShakingError(false);
            setIdInput('');
            setIsAnswerCorrect(null);
            if (inputRef.current) inputRef.current.focus();

            if (nextLives <= 0) {
              sound.detonation();
              setGameState('DETONATED');
            }
          }, 700);
        }
      };

      // Reset & Play Again
      const resetGame = () => {
        setCurrentQIndex(0);
        setLives(3);
        setScore(0);
        setStreak(0);
        setMaxStreak(0);
        setTimeRemaining(TIMER_LIMIT);
        setGameState('PLAYING');
        setSelectedChoice(null);
        setIsAnswerCorrect(null);
        setIdInput('');
        setSessionHistory([]);
      };

      // Calculate accuracy
      const totalAnswered = sessionHistory.length;
      const correctCount = sessionHistory.filter((s) => s.isCorrect).length;
      const accuracyPercent = totalAnswered > 0 ? Math.round((correctCount / totalAnswered) * 100) : 0;

      return (
        <div className="w-full max-w-4xl mx-auto px-4 py-4 md:py-6 flex flex-col min-h-screen justify-between">
          
          {/* ========================================================
              1. TOP HUD BAR
              ======================================================== */}
          <header className="w-full bg-[#181818]/90 backdrop-blur-md border border-[#2e2e2e] rounded-2xl px-4 py-3 flex items-center justify-between shadow-xl mb-4">
            
            {/* Left: Return & Deck Title */}
            <div className="flex items-center gap-3">
              <a 
                href="login.html" 
                className="w-9 h-9 rounded-xl bg-[#222222] hover:bg-[#f04824] hover:text-white border border-[#333333] flex items-center justify-center text-zinc-300 transition-all duration-200"
                title="Return to Library"
              >
                <IconArrowLeft />
              </a>
              <div>
                <span className="text-[10px] uppercase tracking-wider text-zinc-400 block leading-tight">ACTIVE REVIEWER DECK</span>
                <span className="text-xs sm:text-sm font-bold text-white tracking-tight flex items-center gap-1.5">
                  ITE 001 - Networking Midterms
                </span>
              </div>
            </div>

            {/* Center: Round Progress Badge & Format Pill */}
            <div className="hidden sm:flex flex-col items-center">
              <div className="flex items-center gap-2">
                <span className="text-xs font-bold text-zinc-300 bg-[#222222] border border-[#333333] px-2.5 py-0.5 rounded-full">
                  Question {currentQIndex + 1} of {MOCK_DECK.length}
                </span>
                <span className="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-full bg-[#f04824]/20 border border-[#f04824]/50 text-[#f04824]">
                  {activeQ.formatLabel}
                </span>
              </div>
            </div>

            {/* Right: Active Fuse Lives, Sound Toggle & Score */}
            <div className="flex items-center gap-3">
              {/* Sound Toggle */}
              <button 
                onClick={() => setSoundMuted(sound.toggleMute())}
                className="w-8 h-8 rounded-lg bg-[#222222] hover:bg-[#2a2a2a] border border-[#333333] flex items-center justify-center text-zinc-400 hover:text-white transition-colors"
                title={soundMuted ? "Unmute Sound" : "Mute Sound"}
              >
                <IconSpeaker muted={soundMuted} />
              </button>

              {/* 3 Fuse Lives */}
              <div className="flex items-center gap-1.5">
                <MiniBombIcon active={lives >= 1} />
                <MiniBombIcon active={lives >= 2} />
                <MiniBombIcon active={lives >= 3} />
              </div>

              {/* Score & Streak */}
              <div className="text-right pl-2 border-l border-[#2e2e2e]">
                <div className="text-sm sm:text-base font-extrabold text-white leading-tight">
                  {score.toLocaleString()} <span className="text-[10px] text-[#f04824]">PTS</span>
                </div>
                {streak > 1 && (
                  <div className="inline-flex items-center gap-1 text-[10px] font-extrabold text-[#f04824] bg-[#2a1309] border border-[#f04824]/40 px-1.5 py-0.2 rounded">
                    <IconFlame />
                    x{streak} STREAK
                  </div>
                )}
              </div>

            </div>
          </header>

          {/* Mobile Format indicator */}
          <div className="sm:hidden flex items-center justify-between text-xs mb-2 px-1">
            <span className="text-zinc-400">Q {currentQIndex + 1}/{MOCK_DECK.length}</span>
            <span className="text-[#f04824] font-bold">{activeQ.formatLabel}</span>
          </div>

          {/* ========================================================
              2. CENTRAL ACTIVE BOMB STAGE
              ======================================================== */}
          <main className="flex-1 flex flex-col items-center justify-center my-auto">
            
            {/* Mascot Character with Live Fuse Progress */}
            <BombCharacter 
              isDanger={isDanger} 
              isCorrect={isAnswerCorrect === true}
              isError={isShakingError}
              timeRemaining={timeRemaining}
              totalTime={TIMER_LIMIT}
            />

            {/* Active Question Card (High contrast white surface) */}
            <div className="w-full max-w-2xl mt-4 mb-5 bg-white text-slate-900 rounded-2xl md:rounded-[24px] p-5 sm:p-6 shadow-[0_16px_36px_rgba(0,0,0,0.6)] border-2 border-slate-200 text-center relative overflow-hidden transition-all duration-200">
              <div className="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-[#c84e10] via-[#f04824] to-[#ff6b4a]" />
              <div className="text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">
                Prompt #{currentQIndex + 1} &bull; {activeQ.hint}
              </div>
              <h2 className="text-base sm:text-xl md:text-2xl font-extrabold tracking-tight leading-snug text-slate-900">
                {activeQ.prompt}
              </h2>
            </div>

            {/* ========================================================
                3. DUAL INPUT ZONE
                ======================================================== */}
            <div className="w-full max-w-2xl">
              {activeQ.type === 'MULTIPLE_CHOICE' ? (
                /* Mode A: 2x2 Grid of Multiple Choice Cards */
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {activeQ.options.map((opt, idx) => {
                    const letter = String.fromCharCode(65 + idx);
                    const isSelected = selectedChoice === idx;
                    const isCorrectOption = idx === activeQ.correctIndex;
                    
                    let btnStyle = "bg-[#181818] border-[#2e2e2e] text-zinc-200 hover:border-[#f04824] hover:bg-[#1f1f1f]";
                    if (isSelected) {
                      if (isAnswerCorrect) {
                        btnStyle = "bg-emerald-600 border-emerald-400 text-white shadow-[0_0_20px_rgba(16,185,129,0.5)]";
                      } else {
                        btnStyle = "bg-red-600 border-red-400 text-white shadow-[0_0_20px_rgba(239,68,68,0.5)] animate-shake-error";
                      }
                    } else if (selectedChoice !== null && isCorrectOption) {
                      btnStyle = "bg-emerald-600/30 border-emerald-500 text-emerald-200";
                    }

                    return (
                      <button
                        key={idx}
                        onClick={() => handleMultipleChoice(idx)}
                        disabled={selectedChoice !== null}
                        className={`group p-4 rounded-xl border-2 flex items-center gap-3.5 text-left transition-all duration-150 active:scale-[0.98] ${btnStyle}`}
                      >
                        <span className={`w-8 h-8 rounded-lg flex items-center justify-center font-bold text-xs transition-colors ${
                          isSelected 
                            ? 'bg-white text-slate-900' 
                            : 'bg-[#262626] text-zinc-400 group-hover:text-white group-hover:bg-[#f04824]'
                        }`}>
                          {letter}
                        </span>
                        <span className="font-semibold text-sm sm:text-base flex-1">
                          {opt}
                        </span>
                      </button>
                    );
                  })}
                </div>
              ) : (
                /* Mode B: Identification (Type-to-Defuse) */
                <form onSubmit={handleIdentificationSubmit} className="w-full flex flex-col items-center">
                  <div className="w-full bg-[#181818] border border-[#2e2e2e] rounded-2xl p-4 sm:p-5 shadow-2xl">
                    <div className="flex items-center justify-between text-xs mb-2">
                      <label htmlFor="idInput" className="font-bold text-zinc-400 tracking-wider">
                        TYPE THE EXACT TERM TO DEFUSE
                      </label>
                      <span className="px-2 py-0.5 rounded bg-[#242424] border border-[#333333] text-[#f04824] font-bold">
                        {activeQ.hint}
                      </span>
                    </div>

                    <div className="flex items-center gap-2">
                      <div className="relative flex-1">
                        <input
                          id="idInput"
                          ref={inputRef}
                          type="text"
                          autoComplete="off"
                          spellCheck="false"
                          value={idInput}
                          onChange={(e) => setIdInput(e.target.value)}
                          placeholder="Type answer here..."
                          className={`w-full bg-[#0e0b09] border-2 rounded-xl px-4 py-3 text-base sm:text-lg text-white placeholder:text-zinc-600 focus:outline-none transition-all duration-150 ${
                            isShakingError 
                              ? 'border-red-500 shadow-[0_0_15px_rgba(239,68,68,0.5)] animate-shake-error' 
                              : isAnswerCorrect 
                              ? 'border-emerald-500 shadow-[0_0_15px_rgba(16,185,129,0.5)]' 
                              : 'border-[#333333] focus:border-[#f04824]'
                          }`}
                        />
                      </div>
                      <button
                        type="submit"
                        disabled={!idInput.trim()}
                        className="bg-[#f04824] hover:bg-[#ff5a36] disabled:opacity-40 disabled:hover:bg-[#f04824] text-white font-bold px-5 py-3 rounded-xl transition-all duration-150 flex items-center gap-2 shadow-lg shadow-[#f04824]/30"
                      >
                        <IconSparkles />
                        <span className="hidden sm:inline">Defuse</span>
                      </button>
                    </div>

                    <div className="flex items-center justify-between text-[11px] text-zinc-500 mt-2 px-1">
                      <span>Press [Enter] to submit instantly</span>
                      <span>Case-insensitive verification</span>
                    </div>
                  </div>
                </form>
              )}
            </div>

          </main>

          {/* Bottom subtle instruction */}
          <footer className="w-full text-center text-xs text-zinc-500 py-2">
            <span>Co-StudyMaxx Word Bomb Arena &bull; Pure Client-Side Interaction Engine</span>
          </footer>

          {/* ========================================================
              4. END-OF-RUN OVERLAY (Detonated vs. Defused)
              ======================================================== */}
          {gameState !== 'PLAYING' && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="w-full max-w-xl bg-[#141211] border border-[#2e2e2e] rounded-3xl p-6 sm:p-8 shadow-[0_24px_50px_rgba(0,0,0,0.9)] flex flex-col max-h-[90vh]">
                
                {/* Header Status Badge */}
                <div className="text-center mb-5">
                  <div className={`inline-flex items-center justify-center w-16 h-16 rounded-2xl mb-3 shadow-lg ${
                    gameState === 'DEFUSED' 
                      ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/50 shadow-emerald-500/20' 
                      : 'bg-red-500/20 text-red-500 border border-red-500/50 shadow-red-500/20 animate-pulse'
                  }`}>
                    {gameState === 'DEFUSED' ? <IconShieldCheck /> : <IconAlertTriangle />}
                  </div>

                  <h2 className={`text-2xl sm:text-3xl font-black uppercase tracking-tight ${
                    gameState === 'DEFUSED' ? 'text-emerald-400' : 'text-red-500'
                  }`}>
                    {gameState === 'DEFUSED' ? 'ALL BOMBS DEFUSED' : 'BOMB DETONATED'}
                  </h2>
                  <p className="text-zinc-400 text-xs sm:text-sm mt-1">
                    {gameState === 'DEFUSED' 
                      ? 'You successfully defused all questions in the deck before the fuse ran out!' 
                      : 'The countdown fuse triggered critical detonation. Review your answers below.'}
                  </p>
                </div>

                {/* Performance Summary Metrics */}
                <div className="grid grid-cols-3 gap-2 sm:gap-3 bg-[#1c1917] border border-[#2e2e2e] rounded-2xl p-3 sm:p-4 mb-5 text-center">
                  <div>
                    <div className="text-[10px] text-zinc-400 uppercase">FINAL SCORE</div>
                    <div className="text-base sm:text-xl font-extrabold text-white ">{score.toLocaleString()}</div>
                  </div>
                  <div>
                    <div className="text-[10px] text-zinc-400 uppercase">ACCURACY</div>
                    <div className="text-base sm:text-xl font-extrabold text-white ">{accuracyPercent}%</div>
                  </div>
                  <div>
                    <div className="text-[10px] text-zinc-400 uppercase">BEST STREAK</div>
                    <div className="text-base sm:text-xl font-extrabold text-[#f04824] ">x{maxStreak}</div>
                  </div>
                </div>

                {/* Track scores, answers, and history per user & session */}
                <div className="flex-1 overflow-hidden flex flex-col mb-6">
                  <div className="text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2 flex items-center justify-between">
                    <span>SESSION ANSWERS LOG ({sessionHistory.length}/{MOCK_DECK.length})</span>
                    <span>STATUS</span>
                  </div>
                  
                  <div className="overflow-y-auto custom-scroll pr-1 flex flex-col gap-2">
                    {sessionHistory.map((item, idx) => (
                      <div 
                        key={idx} 
                        className={`p-3 rounded-xl border text-xs flex items-start justify-between gap-3 ${
                          item.isCorrect 
                            ? 'bg-emerald-950/20 border-emerald-800/40 text-emerald-200' 
                            : 'bg-red-950/20 border-red-800/40 text-red-200'
                        }`}
                      >
                        <div className="flex-1">
                          <div className="text-zinc-300 font-semibold mb-1">
                            {idx + 1}. {item.question}
                          </div>
                          <div className="flex flex-wrap items-center gap-x-3 gap-y-1 text-[11px]">
                            <span>Your Answer: <b className={item.isCorrect ? 'text-emerald-400' : 'text-red-400'}>{item.userAnswer}</b></span>
                            {!item.isCorrect && (
                              <span>Correct: <b className="text-emerald-400 underline">{item.correctAnswer}</b></span>
                            )}
                          </div>
                        </div>

                        <div className={`px-2 py-1 rounded-md text-[10px] font-bold flex items-center gap-1 shrink-0 ${
                          item.isCorrect ? 'bg-emerald-500/30 text-emerald-300' : 'bg-red-500/30 text-red-300'
                        }`}>
                          {item.isCorrect ? <IconCheck /> : <IconX />}
                          <span>{item.isCorrect ? 'DEFUSED' : 'DETONATED'}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Actions */}
                <div className="flex items-center gap-3">
                  <button
                    onClick={resetGame}
                    className="flex-1 bg-[#f04824] hover:bg-[#ff5a36] text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 transition-colors shadow-lg shadow-[#f04824]/30"
                  >
                    <IconRotateCcw />
                    <span>Play Again</span>
                  </button>

                  <a
                    href="login.html"
                    className="flex-1 bg-transparent hover:bg-[#222222] border border-[#2e2e2e] text-zinc-300 hover:text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 transition-colors text-center"
                  >
                    <IconArrowLeft />
                    <span>Return to Library</span>
                  </a>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BombArena />);
  </script>
</body>
</html>
